name: Propagate the agw-worker.yml leak-fix to the other 8 accounts' copies

# Mohammadlali/agw-workers (ACC0) already has the fix (commits 942d442 +
# f50793c -- the second fixes a stale target_repo case-statement entry
# that was silently skipping the checkout entirely,
# verified live). Each of ACC1..ACC8 hosts its OWN separate agw-workers
# repo (different GitHub account each), so the fix has to be pushed to
# each one individually via the same clone-with-injected-auth-header
# pattern used elsewhere in this repo. This workflow overwrites each
# target's .github/workflows/agw-worker.yml with the exact byte-for-byte
# content already verified working on ACC0's copy, decoded from the
# base64 blob below (embedded only to survive YAML's literal-block-scalar
# indentation rules for a large single line -- not because it needs
# hiding; it is public workflow source, not a secret).

on:
  workflow_dispatch:
    inputs:
      only_acc:
        description: 'Single account number 1-8 to propagate to, or empty for all 8'
        required: false
        default: ''
        type: string

jobs:
  propagate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACC1: ${{ secrets.ACC1 }}
      ACC2: ${{ secrets.ACC2 }}
      ACC3: ${{ secrets.ACC3 }}
      ACC4: ${{ secrets.ACC4 }}
      ACC5: ${{ secrets.ACC5 }}
      ACC6: ${{ secrets.ACC6 }}
      ACC7: ${{ secrets.ACC7 }}
      ACC8: ${{ secrets.ACC8 }}
      ONLY_ACC: ${{ inputs.only_acc }}
    steps:
      - name: Decode the known-good fixed workflow file
        run: |
          echo "" | base64 -d > /tmp/agw-worker-fixed.yml
          python3 -c "import yaml; yaml.safe_load(open('/tmp/agw-worker-fixed.yml'))"
          echo "Decoded and validated OK, $(wc -l < /tmp/agw-worker-fixed.yml) lines."

      - name: Push to each of ACC1..ACC8's own agw-workers repo
        run: |
          declare -A REPO=(
            [1]="momonakikugava-pixel/agw-workers"
            [2]="lali94m-max/agw-workers"
            [3]="ngocgminh5-debug/agw-workers"
            [4]="hmmletssee7-design/agw-workers"
            [5]="kidding602/agw-workers"
            [6]="mohammadlali0707-stack/agw-workers"
            [7]="mohammad97okk/agw-workers"
            [8]="moradzahra85-png/agw-workers"
          )
          for i in 1 2 3 4 5 6 7 8; do
            if [ -n "$ONLY_ACC" ] && [ "$ONLY_ACC" != "$i" ]; then
              continue
            fi
            eval "TOKEN=\$ACC$i"
            TARGET_REPO="${REPO[$i]}"
            if [ -z "$TOKEN" ]; then
              echo "::error::No token for ACC$i -- skipping $TARGET_REPO"
              continue
            fi
            echo "=== ACC$i: $TARGET_REPO ==="
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
            rm -rf /tmp/prop-repo
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" clone \
              "https://github.com/${TARGET_REPO}.git" /tmp/prop-repo
            mkdir -p /tmp/prop-repo/.github/workflows
            cp /tmp/agw-worker-fixed.yml /tmp/prop-repo/.github/workflows/agw-worker.yml
            cd /tmp/prop-repo
            git config user.email "control-room-bot@claud-cloud.local"
            git config user.name "Control Room Bot"
            git add .github/workflows/agw-worker.yml
            if git diff --cached --quiet; then
              echo "ACC$i already up to date -- no commit needed."
            else
              git commit -m "Stop leaking AGY output through public console/summary/artifact, and fix stale Control-Room target_repo entry (propagated from Mohammadlali/agw-workers@f50793c, verified live there first)"
              n=0
              until git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin "HEAD:$(git symbolic-ref --short HEAD)"; do
                n=$((n+1))
                if [ "$n" -ge 4 ]; then echo "::error::push failed for $TARGET_REPO"; break; fi
                sleep $((2 ** n))
                git -c http.https://github.com/.extraHeader="$AUTH_HEADER" fetch origin
                git rebase "origin/$(git symbolic-ref --short HEAD)"
              done
              echo "ACC$i: pushed."
            fi
            cd /
            rm -rf /tmp/prop-repo
          done
