name: Control-Room Gemini Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Manual prompt for Gemini CLI'
        required: false
        default: 'Read AGENTS.md, check Team/WHERE_WE_ARE.md, and run gates.'

concurrency:
  group: gemini-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  gemini-bot:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body || github.event.issue.body, '@gemini-cli')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Intelligent 8-Account Pool & Live Model Quota Resolver
      - name: Resolve Active Key and Working Model
        id: resolver
        env:
          K1: ${{ secrets.GEMINI_API_KEY_1 }}
          K2: ${{ secrets.GEMINI_API_KEY_2 }}
          K3: ${{ secrets.GEMINI_API_KEY_3 }}
          K4: ${{ secrets.GEMINI_API_KEY_4 }}
          K5: ${{ secrets.GEMINI_API_KEY_5 }}
          K6: ${{ secrets.GEMINI_API_KEY_6 }}
          K7: ${{ secrets.GEMINI_API_KEY_7 }}
          K8: ${{ secrets.GEMINI_API_KEY_8 }}
        run: |
          python3 - << 'EOF'
          import os
          import sys
          import urllib.request
          import urllib.error
          import json
          import random

          keys = {}
          for i in range(1, 9):
              k = os.environ.get(f"K{i}", "").strip()
              if k:
                  keys[i] = k

          if not keys:
              print("::error::No GEMINI_API_KEY secrets configured (checked 1-8).")
              sys.exit(1)

          # Candidate models in priority order: Flash models have active free quotas on AI Studio
          CANDIDATE_MODELS = [
              "gemini-2.5-flash",
              "gemini-2.0-flash",
              "gemini-1.5-flash",
              "gemini-2.5-pro",
              "gemini-1.5-pro"
          ]

          # Randomize keys to balance daily load
          indices = list(keys.keys())
          random.shuffle(indices)

          selected_acc = None
          selected_key = None
          selected_model = None

          print(f"Probing {len(keys)} accounts across candidate models for active quota...")
          payload = json.dumps({"contents": [{"parts": [{"text": "ping"}]}]}).encode("utf-8")

          for idx in indices:
              key = keys[idx]
              print(f"\nEvaluating Account #{idx}...")
              for model in CANDIDATE_MODELS:
                  url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}"
                  req = urllib.request.Request(
                      url,
                      data=payload,
                      headers={"Content-Type": "application/json", "User-Agent": "Control-Room-Bot"}
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=8) as response:
                          if response.status == 200:
                              selected_acc = idx
                              selected_key = key
                              selected_model = model
                              print(f"-> SUCCESS: Account #{idx} passed health check with model '{model}' (HTTP 200)!")
                              break
                  except urllib.error.HTTPError as e:
                      err_body = e.read().decode("utf-8", "replace")[:120]
                      print(f"   Model '{model}': HTTP {e.code} - {err_body}")
                  except Exception as e:
                      print(f"   Model '{model}': error {e}")

              if selected_key:
                  break

          if not selected_key:
              print("::warning::No candidate model returned 200. Falling back to Account 1 with gemini-2.5-flash.")
              selected_acc = 1
              selected_key = keys.get(1) or list(keys.values())[0]
              selected_model = "gemini-2.5-flash"

          print(f"\nFinal Selection: Account #{selected_acc} using model '{selected_model}'")

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(f"ACTIVE_GEMINI_KEY={selected_key}\n")
              env_file.write(f"ACTIVE_GEMINI_MODEL={selected_model}\n")
              env_file.write(f"ACTIVE_ACCOUNT_INDEX={selected_acc}\n")

          with open(os.environ["GITHUB_OUTPUT"], "a") as out_file:
              out_file.write(f"acc_idx={selected_acc}\n")
              out_file.write(f"model={selected_model}\n")
          EOF

      - name: Run Gemini CLI Assistant
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ env.ACTIVE_GEMINI_KEY }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": "${{ env.ACTIVE_GEMINI_MODEL }}"
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      - name: Report Account Usage
        if: always()
        run: |
          echo "### 🤖 Gemini Bot Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Active Account Used:** Account #${{ steps.resolver.outputs.acc_idx }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Active Model Used:** \`${{ steps.resolver.outputs.model }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.issue.number }}" ]; then
            echo "- **Issue Number:** #${{ github.event.issue.number }}" >> $GITHUB_STEP_SUMMARY
          fi
