name: Control-Room Gemini Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Manual prompt for Gemini CLI'
        required: false
        default: 'Read AGENTS.md, check Team/WHERE_WE_ARE.md, and run gates.'

concurrency:
  group: gemini-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  gemini-bot:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.body, '@gemini-cli') ||
      contains(github.event.comment.body, '@gemini-cli')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =========================================================================
      # TIER 1: Account 1
      # =========================================================================
      - name: Run Gemini CLI (Account 1)
        id: acc1
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_1 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-3.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # TIER 2: Account 2 (Fallback — only if Account 1 did NOT succeed)
      # =========================================================================
      - name: Reset Tree Before Account 2
        if: steps.acc1.outcome != 'success'
        run: git reset --hard HEAD; git clean -fd

      - name: Run Gemini CLI (Account 2 - Fallback)
        id: acc2
        if: steps.acc1.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_2 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-3.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # TIER 3: Account 3 (Fallback — only if Accounts 1 & 2 did NOT succeed)
      # =========================================================================
      - name: Reset Tree Before Account 3
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success'
        run: git reset --hard HEAD; git clean -fd

      - name: Run Gemini CLI (Account 3 - Fallback)
        id: acc3
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_3 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-3.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # TIER 4: Account 4 (Fallback — only if Accounts 1-3 did NOT succeed)
      # =========================================================================
      - name: Reset Tree Before Account 4
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success'
        run: git reset --hard HEAD; git clean -fd

      - name: Run Gemini CLI (Account 4 - Fallback)
        id: acc4
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_4 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-3.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # TIER 5: Account 5 (Fallback — only if Accounts 1-4 did NOT succeed)
      # =========================================================================
      - name: Reset Tree Before Account 5
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success' && steps.acc4.outcome != 'success'
        run: git reset --hard HEAD; git clean -fd

      - name: Run Gemini CLI (Account 5 - Fallback)
        id: acc5
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success' && steps.acc4.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_5 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-3.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # TIER 6: Account 6 (Fallback — only if Accounts 1-5 did NOT succeed)
      # =========================================================================
      - name: Reset Tree Before Account 6
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success' && steps.acc4.outcome != 'success' && steps.acc5.outcome != 'success'
        run: git reset --hard HEAD; git clean -fd

      - name: Run Gemini CLI (Account 6 - Fallback)
        id: acc6
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success' && steps.acc4.outcome != 'success' && steps.acc5.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_6 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-3.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # TIER 7: Account 7 (Fallback — only if Accounts 1-6 did NOT succeed)
      # =========================================================================
      - name: Reset Tree Before Account 7
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success' && steps.acc4.outcome != 'success' && steps.acc5.outcome != 'success' && steps.acc6.outcome != 'success'
        run: git reset --hard HEAD; git clean -fd

      - name: Run Gemini CLI (Account 7 - Fallback)
        id: acc7
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success' && steps.acc4.outcome != 'success' && steps.acc5.outcome != 'success' && steps.acc6.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_7 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-3.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # TIER 8: Account 8 (Last Resort — only if Accounts 1-7 did NOT succeed)
      # =========================================================================
      - name: Reset Tree Before Account 8
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success' && steps.acc4.outcome != 'success' && steps.acc5.outcome != 'success' && steps.acc6.outcome != 'success' && steps.acc7.outcome != 'success'
        run: git reset --hard HEAD; git clean -fd

      - name: Run Gemini CLI (Account 8 - Last Resort)
        id: acc8
        if: steps.acc1.outcome != 'success' && steps.acc2.outcome != 'success' && steps.acc3.outcome != 'success' && steps.acc4.outcome != 'success' && steps.acc5.outcome != 'success' && steps.acc6.outcome != 'success' && steps.acc7.outcome != 'success'
        continue-on-error: true
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GEMINI_MODEL: gemini-3.5-flash
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_8 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-3.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # FINAL GATE: Hard fail if all 8 accounts exhausted
      # =========================================================================
      - name: All Accounts Exhausted — Hard Fail
        if: |
          always() &&
          steps.acc1.outcome != 'success' &&
          steps.acc2.outcome != 'success' &&
          steps.acc3.outcome != 'success' &&
          steps.acc4.outcome != 'success' &&
          steps.acc5.outcome != 'success' &&
          steps.acc6.outcome != 'success' &&
          steps.acc7.outcome != 'success' &&
          steps.acc8.outcome != 'success'
        run: |
          echo "❌ All 8 API key tiers exhausted. Check quota and secrets." >&2
          exit 1

      # Summary
      - name: Report Fallback Execution Summary
        if: always()
        run: |
          echo "### 🤖 Gemini Bot Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ github.event.issue.number }}" ]; then
            echo "- **Issue Number:** #${{ github.event.issue.number }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Model Used:** gemini-3.5-flash" >> $GITHUB_STEP_SUMMARY
          echo "- **Account 1:** ${{ steps.acc1.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Account 2:** ${{ steps.acc2.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Account 3:** ${{ steps.acc3.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Account 4:** ${{ steps.acc4.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Account 5:** ${{ steps.acc5.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Account 6:** ${{ steps.acc6.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Account 7:** ${{ steps.acc7.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Account 8:** ${{ steps.acc8.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
