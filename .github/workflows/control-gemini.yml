name: Control-Room Gemini Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Manual prompt for Gemini CLI'
        required: false
        default: 'Read AGENTS.md, check Team/WHERE_WE_ARE.md, and run gates.'

concurrency:
  group: gemini-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  gemini-bot:
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.comment.body || github.event.issue.body, '@gemini-cli')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =========================================================================
      # TIER 1: Account 1
      # =========================================================================
      - name: Run Gemini CLI (Account 1)
        id: acc1
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_1 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-2.5-flash" }
            }
          prompt: |
            Read AGENTS.md at the repository root and follow it strictly -- it is this repository's non-negotiable governance law.
            Orient immediately from Team/WHERE_WE_ARE.md and Team/MAP.md before touching any file.
            Perform the task requested in the triggering issue or comment.
            Ensure all tests and verification gates (python Tools/run_gates.py) pass with zero errors.
            Record every commit in Team/CHANGELOG.md with its real short hash and push directly to main.

      # =========================================================================
      # TIER 2: Account 2 (Fallback if Account 1 fails/exhausted)
      # =========================================================================
      - name: Reset Tree on Account 1 Failure
        if: failure()
        run: git reset --hard HEAD; git clean -fd

      - name: Run Gemini CLI (Account 2 - Fallback)
        if: failure()
        id: acc2
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY_2 }}
          github_issue_number: ${{ github.event.issue.number }}
          workflow_name: control-gemini
          settings: |
            {
              "model": { "id": "gemini-2.5-flash" }
            }
