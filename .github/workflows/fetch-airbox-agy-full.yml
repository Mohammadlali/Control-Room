name: One-off - fetch AirboxVIP's full agy-issue-bot.yml

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ACC1: ${{ secrets.ACC1 }}
    steps:
      - name: Print full content
        run: |
          curl -sS -H "Authorization: Bearer $ACC1" \
            -H "Accept: application/vnd.github.v3.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/momonakikugava-pixel/AirboxVIP_Coffeenet/contents/.github/workflows/agy-issue-bot.yml"
