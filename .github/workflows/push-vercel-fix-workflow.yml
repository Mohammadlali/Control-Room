name: Push and run the Vercel protection fix on status-dashboard

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  push-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DST_TOKEN: ${{ secrets.ACC0 }}
      REPO: Mohammadlali/status-dashboard
      BRANCH: main
    steps:
      - name: Checkout control-room (for the staged workflow file)
        uses: actions/checkout@v4

      - name: Clone status-dashboard and add the workflow file
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          echo "AUTH_HEADER=$AUTH_HEADER" >> "$GITHUB_ENV"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch "$BRANCH" --single-branch \
            "https://github.com/$REPO.git" /tmp/sd
          mkdir -p /tmp/sd/.github/workflows
          cp .github/deploy-staging/status-dashboard-update/check-fix-vercel-protection.yml /tmp/sd/.github/workflows/check-fix-vercel-protection.yml
          cd /tmp/sd
          git config user.email "control-room-bot@claud-cloud.local"
          git config user.name "Control Room Bot"
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/check-fix-vercel-protection.yml'))"
          git add .github/workflows/check-fix-vercel-protection.yml
          git commit -m "Add one-off workflow: check/fix Vercel SSO deployment protection"
          n=0
          until git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin "HEAD:$BRANCH"; do
            n=$((n+1))
            if [ "$n" -ge 4 ]; then echo "push failed after 4 attempts"; exit 1; fi
            sleep $((2 ** n))
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          echo "Pushed: $(git rev-parse --short HEAD)"

      - name: Dispatch the new workflow and watch it
        env:
          GH_TOKEN: ${{ secrets.ACC0 }}
        run: |
          set -e
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sleep 5
          gh workflow run check-fix-vercel-protection.yml -R "$REPO" --ref "$BRANCH"
          RUN_ID=""
          for i in $(seq 1 20); do
            sleep 6
            RUN_ID=$(gh run list -R "$REPO" --workflow check-fix-vercel-protection.yml --branch "$BRANCH" --json databaseId,createdAt --jq "[.[] | select(.createdAt > \"$BEFORE\")] | .[0].databaseId // empty")
            if [ -n "$RUN_ID" ]; then break; fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::no new run appeared"
            exit 1
          fi
          echo "watching run $RUN_ID"
          gh run watch "$RUN_ID" -R "$REPO" --exit-status
