name: Diagnostic -- which account secret names actually resolve non-empty here

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ACC0: ${{ secrets.ACC0 }}
      ACC1: ${{ secrets.ACC1 }}
      ACC2: ${{ secrets.ACC2 }}
      ACC3: ${{ secrets.ACC3 }}
      ACC4: ${{ secrets.ACC4 }}
      ACC5: ${{ secrets.ACC5 }}
      ACC6: ${{ secrets.ACC6 }}
      ACC7: ${{ secrets.ACC7 }}
      ACC8: ${{ secrets.ACC8 }}
    steps:
      - name: Report presence only, never the value
        run: |
          for name in ACC0 ACC1 ACC2 ACC3 ACC4 ACC5 ACC6 ACC7 ACC8; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "$name: EMPTY"
            else
              echo "$name: present (${#val} chars)"
            fi
          done
