name: Diagnostic -- which account secret names actually resolve non-empty here

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ACC0: ${{ secrets.ACC0 }}
      ACC0_PAT: ${{ secrets.ACC0_PAT }}
      ACC1_PAT: ${{ secrets.ACC1_PAT }}
      ACC2_PAT: ${{ secrets.ACC2_PAT }}
      ACC3_PAT: ${{ secrets.ACC3_PAT }}
      ACC4_PAT: ${{ secrets.ACC4_PAT }}
      ACC5_PAT: ${{ secrets.ACC5_PAT }}
      ACC6_PAT: ${{ secrets.ACC6_PAT }}
      ACC7_PAT: ${{ secrets.ACC7_PAT }}
      ACC8_PAT: ${{ secrets.ACC8_PAT }}
      ACC6: ${{ secrets.ACC6 }}
    steps:
      - name: Report presence only, never the value
        run: |
          for name in ACC0 ACC0_PAT ACC1_PAT ACC2_PAT ACC3_PAT ACC4_PAT ACC5_PAT ACC6_PAT ACC7_PAT ACC8_PAT ACC6; do
            val="${!name}"
            if [ -z "$val" ]; then
              echo "$name: EMPTY"
            else
              echo "$name: present (${#val} chars)"
            fi
          done
