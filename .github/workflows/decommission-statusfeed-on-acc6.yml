name: Decommission StatusFeed on ACC6 (moved to Mohammadlali/status-dashboard)

on:
  workflow_dispatch: {}

jobs:
  decommission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DST_TOKEN: ${{ secrets.ACC6 }}
    steps:
      - name: Guard
        run: |
          if [ -z "$DST_TOKEN" ]; then
            echo "::error::secrets.ACC6 is not set on this repo."
            exit 1
          fi

      - name: Clone ACC6's Claud-Cloud-Project directly
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch claude/gateway-auth-fix-nr7k0b --single-branch \
            "https://github.com/mohammadlali0707-stack/Claud-Cloud-Project.git" /tmp/ccp

      - name: Remove StatusFeed and its deploy workflow (backlog-dispatcher.yml left alone -- unrelated)
        working-directory: /tmp/ccp
        run: |
          set -e
          git rm -r --quiet StatusFeed
          git rm --quiet .github/workflows/deploy-status-feed.yml
          git rm --quiet Tools/collect_status_feed.py Tools/send_push_notification.py Tools/ensure_cloudflare_dns.py
          echo "Removed. Remaining .github/workflows:"
          ls .github/workflows/

      - name: Patch Team/MAP.md
        working-directory: /tmp/ccp
        run: |
          set -e
          echo "" | base64 -d > /tmp/patch_map.py
          python3 /tmp/patch_map.py

      - name: Append Team/CHANGELOG.md entry
        working-directory: /tmp/ccp
        run: |
          set -e
          {
            echo ""
            echo "- \`(this repo's hash follows in a \\\`changelog:\\\` follow-up)\` -- moved the status dashboard (StatusFeed/, deploy-status-feed.yml, and its three Tools/*.py scripts) out of this repo entirely, to a new dedicated repo \`Mohammadlali/status-dashboard\` under ACC0. The dashboard was never CCP-specific -- it reports on Control-Room and all 9 accounts too -- so per the owner's own observation it belongs to the account that manages the fleet, not bundled inside this product repo hosted on a different account. New repo created, all source copied byte-exact, all 15 secrets migrated (values never leave a workflow running in the repo that owns them), and a real first deploy verified end-to-end: live Vercel URL, alias assigned to status.airboxvip.top on the first attempt, checker confirmed success from the raw job log. Two non-blocking gaps found and left for follow-up: status.json will never actually get committed to the new repo (git diff on a never-tracked file reports no change, so the add/commit step no-ops every run -- the live site stays fresh regardless since Vercel deploys the freshly-generated workspace file, not the git-tracked one), and R2 calls (push-subscription load + snapshot archive) failed with an SSL handshake error on that first run, non-fatal, not yet root-caused. Consequence for THIS repo: check_status_feed_freshness.py will now always report no_status_file, the same class of permanent-red this project has already documented once before for the now-deleted ACC0 checkout -- not fixed here (retiring the gate line itself is real follow-up work for a session that can run and verify the full gate suite on this repo, not just push files to it cross-account)."
          } >> Team/CHANGELOG.md

      - name: Commit and push
        working-directory: /tmp/ccp
        run: |
          set -e
          git config user.email "control-room-bot@claud-cloud.local"
          git config user.name "Control Room Bot"
          git add -A
          git commit -m "Move StatusFeed dashboard to Mohammadlali/status-dashboard (not CCP-specific)"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin HEAD:claude/gateway-auth-fix-nr7k0b
          echo "Pushed."
