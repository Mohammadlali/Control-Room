name: Fix Vercel alias race condition on ACC6 (cross-account)

# Real root cause found 2026-09-11 while investigating "site still shows
# 3h-old data despite the run reporting success": run 34619809977's
# "Deploy to Vercel" step built and uploaded a real new deployment, but
# `vercel alias set` failed with "the deployment ... is not ready" --
# Vercel had not finished marking the fresh deployment ready by the time
# the alias call ran. Because that line ended in `|| true`, the whole job
# still reported success, so the live subdomain silently kept pointing at
# the PREVIOUS deployment. Fix: retry the alias assignment with backoff,
# and fail the job for real if it never succeeds, so a stale alias is
# never reported as a green run again.
#
# The patch is applied via a base64-encoded Python script rather than an
# inline heredoc: the old/new blocks and the patcher itself are pinned as
# opaque base64 blobs so no YAML-block indentation or `${{ }}`-escaping
# subtlety (both bit this same effort earlier today) can silently corrupt
# them. The substitution was dry-run and verified locally before this
# workflow was ever written.

on:
  workflow_dispatch: {}

jobs:
  fix-on-acc6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DST_TOKEN: ${{ secrets.ACC6 }}
    steps:
      - name: Guard
        run: |
          if [ -z "$DST_TOKEN" ]; then
            echo "::error::secrets.ACC6 is not set on this repo."
            exit 1
          fi

      - name: Clone ACC6's Claud-Cloud-Project directly
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch claude/gateway-auth-fix-nr7k0b --single-branch \
            "https://github.com/mohammadlali0707-stack/Claud-Cloud-Project.git" /tmp/ccp

      - name: Add a retry loop around the Vercel alias assignment
        working-directory: /tmp/ccp
        run: |
          set -e
          echo "" | base64 -d > /tmp/old_block.txt
          echo "" | base64 -d > /tmp/new_block.txt
          echo "" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

          echo "=== Read the property back ==="
          grep -qF -- "ALIAS_OK=false" .github/workflows/deploy-status-feed.yml || { echo "::error::retry loop never landed"; exit 1; }
          grep -qF -- '|| true' .github/workflows/deploy-status-feed.yml && { echo "::error::old silent-failure pattern still present"; exit 1; }
          echo "Retry loop verified present, old silent-failure pattern verified gone."

          if git diff --quiet; then
            echo "No diff -- already fixed."
            echo "ALREADY_FIXED=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_FIXED=false" >> "$GITHUB_ENV"
          fi

      - name: Record and push
        if: env.ALREADY_FIXED == 'false'
        working-directory: /tmp/ccp
        run: |
          set -e
          {
            echo ""
            echo "- \`(this repo's hash follows in a \\\`changelog:\\\` follow-up)\` -- fixed a real bug found while investigating a stale status feed: \`deploy-status-feed.yml\`'s Vercel alias step failed with \\\"the deployment ... is not ready\\\" right after a successful build (run 34619809977, confirmed from the raw job log) -- a normal Vercel propagation delay, not this session's doing. Because the alias line ended in \`|| true\`, the job still reported success while \`status.airboxvip.top\` silently kept pointing at the PREVIOUS deployment. Added a 6-attempt retry loop with a 10s backoff, and the job now fails for real if the alias never lands, instead of reporting a false green."
          } >> Team/CHANGELOG.md
          git config user.email "control-room-bot@claud-cloud.local"
          git config user.name "Control Room Bot"
          git add .github/workflows/deploy-status-feed.yml Team/CHANGELOG.md
          git commit -m "Retry the Vercel alias assignment instead of silently swallowing failure"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin HEAD:claude/gateway-auth-fix-nr7k0b

      - name: Dispatch deploy-status-feed.yml on ACC6 to verify end-to-end
        if: env.ALREADY_FIXED == 'false'
        env:
          GH_TOKEN: ${{ secrets.ACC6 }}
        run: |
          set -e
          sleep 5
          gh workflow run deploy-status-feed.yml \
            --repo mohammadlali0707-stack/Claud-Cloud-Project \
            --ref claude/gateway-auth-fix-nr7k0b
          echo "Dispatched on ACC6."
