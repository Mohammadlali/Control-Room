name: One-off - list AirboxVIP_Coffeenet's workflow files

on:
  workflow_dispatch: {}

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ACC1: ${{ secrets.ACC1 }}
    steps:
      - name: List .github/workflows on AirboxVIP_Coffeenet
        run: |
          curl -sS -H "Authorization: Bearer $ACC1" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/momonakikugava-pixel/AirboxVIP_Coffeenet/contents/.github/workflows" \
            | jq -r '.[].name'
