name: Control-Room Claude Bot

# Claude Code, driven from an issue or comment containing @claude anywhere
# in the text, as the owner or a collaborator. Mirrors the same c1-then-c2
# OAuth failover already proven on every one of ACC1..ACC8's own
# agw-claude.yml (adapted from Claud-Cloud-Project's tbs-claude.yml
# originally): if the first account's run fails outright (quota, auth,
# any error), the working tree is reset and a second account retries
# before giving up. This repo had neither the secrets nor a @claude
# listener at all until the owner added CLAUDE_CODE_OAUTH_TOKEN and
# CLAUDE_CODE_OAUTH_TOKEN2 -- see CHANGELOG.md for the audit that found
# the gap.
#
# Excludes @agy issues (control-agy.yml's own trailing-@agy trigger) so
# one issue doesn't fire both bots at once. The exclusion checks the
# TRAILING form since that is what control-agy.yml itself now requires.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: >
      contains(github.event.comment.body || github.event.issue.body, '@claude') &&
      !(
        endsWith(github.event.issue.body, '@agy') ||
        endsWith(github.event.issue.body, '@agy\n') ||
        endsWith(github.event.issue.body, '@agy\r\n')
      ) &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        (
          github.event.comment.user.login == 'claude[bot]' &&
          (endsWith(github.event.comment.body, '@claude') || endsWith(github.event.comment.body, '@claude\n') || endsWith(github.event.comment.body, '@claude\r\n'))
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # One Claude per issue -- two running at once would both push to the
    # same branch and the second would deliver over the first.
    concurrency:
      group: control-claude-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude, account 1
        id: c1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          claude_args: '--append-system-prompt "When you have COMPLETELY finished this task -- not a partial draft, nothing left to do -- end your final reply with the line \"@agy\" on its own line, so the agy worker can continue from your result. If you are not fully done yet, do not include that line."'

      # Same reasoning as tbs-claude.yml/agw-claude.yml: c1 dying mid-edit
      # can leave the working tree dirty and an issue-branch that
      # collides with c2's own (the action derives the branch name from
      # issue number + minute). Print status/diff before discarding so an
      # abandoned edit is findable in the log, then detach and drop any
      # claude/issue-* branch c1 made so c2 can create its own.
      - name: Clean working tree before failover
        id: clean_before_c2
        if: steps.c1.outcome == 'failure'
        continue-on-error: true
        run: |
          set +e
          echo "--- git status (c1's uncommitted work, about to be discarded) ---"
          git status
          echo "--- git diff --stat ---"
          git diff --stat
          git reset --hard HEAD
          git clean -fd
          echo "--- detach, then drop c1's issue branches so c2 can make its own ---"
          git checkout --force --detach HEAD
          BR=$(git for-each-ref --format='%(refname:short)' 'refs/heads/claude/issue-*')
          echo "branches to delete: ${BR:-<none>}"
          [ -n "$BR" ] && printf '%s\n' "$BR" | xargs -n1 git branch -D
          echo "--- local branches that remain ---"
          git branch

      - name: Claude, account 2
        id: c2
        if: steps.c1.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN2 }}
          show_full_output: true
          claude_args: '--append-system-prompt "When you have COMPLETELY finished this task -- not a partial draft, nothing left to do -- end your final reply with the line \"@agy\" on its own line, so the agy worker can continue from your result. If you are not fully done yet, do not include that line."'

      - name: Log c1/c2 outcomes
        if: always()
        run: echo "c1 outcome=${{ steps.c1.outcome }} c2 outcome=${{ steps.c2.outcome }}"
