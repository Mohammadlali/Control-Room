name: Audit @claude trigger + secrets across the fleet

# Owner wants a trailing @claude in an issue/comment to trigger the
# Claude bot on every account, ACC0..ACC8. Before building or changing
# anything: (1) does this repo (where such a mechanism would live for
# ACC0) even have the Claude Code OAuth secrets a listener needs, and
# (2) what does each other account already have. Read-only -- checks
# secret PRESENCE (never a value) via a plain `if [ -n "$SECRET" ]` the
# same way check-secrets.yml on ACC6 does, and reads each account's
# agw-claude.yml (or tbs-claude.yml on TBS) via the Contents API using
# that account's own bare ACC<N> PAT.

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACC1: ${{ secrets.ACC1 }}
      ACC2: ${{ secrets.ACC2 }}
      ACC3: ${{ secrets.ACC3 }}
      ACC4: ${{ secrets.ACC4 }}
      ACC5: ${{ secrets.ACC5 }}
      ACC6: ${{ secrets.ACC6 }}
      ACC7: ${{ secrets.ACC7 }}
      ACC8: ${{ secrets.ACC8 }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN2 }}
    steps:
      - name: Check this repo's own Claude Code OAuth secrets
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "control-room: CLAUDE_CODE_OAUTH_TOKEN present"; else echo "control-room: CLAUDE_CODE_OAUTH_TOKEN MISSING"; fi
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN2" ]; then echo "control-room: CLAUDE_CODE_OAUTH_TOKEN2 present"; else echo "control-room: CLAUDE_CODE_OAUTH_TOKEN2 MISSING (no failover account)"; fi

      - name: Check each listener's @claude trigger + presence
        run: |
          # acc_index|repo|path
          ENTRIES=(
            "1|momonakikugava-pixel/agw-workers|.github/workflows/agw-claude.yml"
            "2|lali94m-max/agw-workers|.github/workflows/agw-claude.yml"
            "3|ngocgminh5-debug/agw-workers|.github/workflows/agw-claude.yml"
            "4|hmmletssee7-design/agw-workers|.github/workflows/agw-claude.yml"
            "5|kidding602/agw-workers|.github/workflows/agw-claude.yml"
            "6|mohammadlali0707-stack/agw-workers|.github/workflows/agw-claude.yml"
            "7|mohammad97okk/agw-workers|.github/workflows/agw-claude.yml"
            "8|moradzahra85-png/agw-workers|.github/workflows/agw-claude.yml"
            "1|momonakikugava-pixel/AirboxVIP_Coffeenet|.github/workflows/agy-issue-bot.yml"
            "6|mohammadlali0707-stack/Claud-Cloud-Project|.github/workflows/tbs-claude.yml"
          )

          for entry in "${ENTRIES[@]}"; do
            IFS='|' read -r IDX REPO PATH_ <<< "$entry"
            eval "TOKEN=\$ACC$IDX"
            if [ -z "$TOKEN" ]; then
              echo "ACC$IDX $REPO $PATH_: no token (secrets.ACC$IDX missing)"
              continue
            fi
            CODE=$(curl -sS -o /tmp/file.txt -w "%{http_code}" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github.v3.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/contents/${PATH_}")
            if [ "$CODE" != "200" ]; then
              echo "ACC$IDX $REPO $PATH_: HTTP $CODE -- file not found (this repo may not have a @claude listener at all)"
              continue
            fi
            if grep -qE "endsWith\(github\.event\.(issue|comment)\.body, '@claude'\)" /tmp/file.txt; then
              CONV="trailing (endsWith)"
            elif grep -qE "startsWith\(github\.event\.(issue|comment)\.body, '@claude'\)" /tmp/file.txt; then
              CONV="leading (startsWith) -- would NOT match a trailing @claude"
            elif grep -qE "contains\(.*'@claude'\)" /tmp/file.txt; then
              CONV="anywhere (contains) -- already matches trailing too"
            elif grep -q "'@claude'" /tmp/file.txt; then
              CONV="mentions @claude, unrecognized pattern -- inspect manually"
            else
              CONV="no @claude trigger found in this file"
            fi
            echo "ACC$IDX $REPO $PATH_: convention=$CONV"
          done
