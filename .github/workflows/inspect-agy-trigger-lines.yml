name: One-off - inspect exact @agy trigger lines on AirboxVIP and TBS

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      ACC1: ${{ secrets.ACC1 }}
      ACC6: ${{ secrets.ACC6 }}
    steps:
      - name: Print the trigger condition context from each file
        run: |
          fetch() {
            local token="$1" repo="$2"
            curl -sS -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github.v3.raw" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/contents/.github/workflows/agy-issue-bot.yml"
          }
          echo "=== AirboxVIP_Coffeenet ==="
          fetch "$ACC1" "momonakikugava-pixel/AirboxVIP_Coffeenet" > /tmp/airbox.yml
          grep -n -B3 -A3 "startsWith" /tmp/airbox.yml
          echo "--- full 'on:'/'if:' block ---"
          sed -n '1,40p' /tmp/airbox.yml

          echo ""
          echo "=== Claud-Cloud-Project (TBS) ==="
          fetch "$ACC6" "mohammadlali0707-stack/Claud-Cloud-Project" > /tmp/tbs.yml
          grep -n -B3 -A3 "startsWith" /tmp/tbs.yml
          echo "--- full 'on:'/'if:' block ---"
          sed -n '1,40p' /tmp/tbs.yml
