name: One-off - build @claude support on AirboxVIP_Coffeenet

# Owner asked for AirboxVIP_Coffeenet to be "fully supported" for
# @claude, matching every other account. This does two things there,
# using the repo's own ACC1 PAT:
#   1. Adds .github/workflows/airbox-claude.yml (this repo's
#      fleet-fixes/airbox-claude.yml -- self-contained, mirrors
#      agw-claude.yml exactly, direct run rather than a relay, since
#      Claude Code action only needs one Anthropic OAuth token, unlike
#      @agy's 9-account identity pool). NEEDS its own
#      CLAUDE_CODE_OAUTH_TOKEN/CLAUDE_CODE_OAUTH_TOKEN2 secrets added
#      directly to AirboxVIP_Coffeenet -- GitHub secrets are
#      per-repository, so ACC1's agw-workers already having them does
#      not extend here. Not something this workflow can check or set.
#   2. Surgically patches the EXISTING agy-issue-bot.yml (via
#      Tools/patch_airbox_claude_handoff.py) to complete the handoff
#      loop: accept a claude[bot] comment ending in trailing @agy, tell
#      agy to end with a trailing @claude when fully done, and put the
#      "AGY worker: URL" footer BEFORE agy's own output instead of after
#      -- the old order buried any trailing @claude marker under the
#      footer, which would have silently broken the new instruction in
#      (2) is meant to enable.

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACC1: ${{ secrets.ACC1 }}
    steps:
      - uses: actions/checkout@v4

      - name: Push airbox-claude.yml (new file)
        run: |
          set -e
          NEW_CONTENT_B64=$(base64 -w0 fleet-fixes/airbox-claude.yml)
          MSG='feat: add @claude bot, mirroring every other account (owner requested full support)'
          PAYLOAD=$(jq -n --arg msg "$MSG" --arg content "$NEW_CONTENT_B64" \
            '{message:$msg, content:$content}')
          CODE=$(curl -sS -o /tmp/put1.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $ACC1" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/momonakikugava-pixel/AirboxVIP_Coffeenet/contents/.github/workflows/airbox-claude.yml" \
            -d "$PAYLOAD")
          echo "PUT HTTP $CODE for airbox-claude.yml"
          if [ "$CODE" != "201" ] && [ "$CODE" != "200" ]; then
            echo "::error::failed to create airbox-claude.yml"
            cat /tmp/put1.json
            exit 1
          fi
          echo "airbox-claude.yml created."

      - name: Patch agy-issue-bot.yml for the @agy <-> @claude handoff
        run: |
          set -e
          RESP=$(curl -sS -H "Authorization: Bearer $ACC1" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/momonakikugava-pixel/AirboxVIP_Coffeenet/contents/.github/workflows/agy-issue-bot.yml")
          SHA=$(echo "$RESP" | jq -r '.sha')
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            echo "::error::could not fetch sha"
            echo "$RESP"
            exit 1
          fi
          echo "$RESP" | jq -r '.content' | base64 -d > /tmp/orig.yml

          STATUS=$(python3 Tools/patch_airbox_claude_handoff.py /tmp/orig.yml /tmp/patched.yml)
          echo "patch status: $STATUS"
          if [ "$STATUS" != "CHANGED" ]; then
            echo "nothing to change, skipping write"
            exit 0
          fi

          python3 Tools/validate_yaml.py /tmp/patched.yml
          echo "--- unified diff ---"
          diff -u /tmp/orig.yml /tmp/patched.yml || true

          NEW_CONTENT_B64=$(base64 -w0 /tmp/patched.yml)
          MSG='fix: complete the @agy <-> @claude handoff loop -- accept claude[bot] comments, end with trailing @claude when done, put the worker-URL footer before agy output so a trailing marker survives'
          PAYLOAD=$(jq -n --arg msg "$MSG" --arg content "$NEW_CONTENT_B64" --arg sha "$SHA" \
            '{message:$msg, content:$content, sha:$sha}')
          CODE=$(curl -sS -o /tmp/put2.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $ACC1" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/momonakikugava-pixel/AirboxVIP_Coffeenet/contents/.github/workflows/agy-issue-bot.yml" \
            -d "$PAYLOAD")
          echo "PUT HTTP $CODE for agy-issue-bot.yml"
          if [ "$CODE" != "200" ]; then
            echo "::error::PUT failed"
            cat /tmp/put2.json
            exit 1
          fi
          echo "agy-issue-bot.yml patched successfully."
