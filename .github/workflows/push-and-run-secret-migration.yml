name: Push and run the secret-migration workflow on ACC6

# Pushes migrate-secrets-to-status-dashboard.yml onto ACC6 (base64,
# since that file's own many ${{ secrets.X }} expressions must survive
# as literal text and this repo has no secrets of those names), then
# dispatches it there via secrets.ACC6. That workflow runs physically
# on ACC6 so it can resolve its own real secret values and hand them
# (via `gh secret set`, never printed) to the new status-dashboard repo.

on:
  workflow_dispatch: {}

jobs:
  push-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DST_TOKEN: ${{ secrets.ACC6 }}
    steps:
      - name: Guard
        run: |
          if [ -z "$DST_TOKEN" ]; then
            echo "::error::secrets.ACC6 is not set on this repo."
            exit 1
          fi

      - name: Clone ACC6's Claud-Cloud-Project directly
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch claude/gateway-auth-fix-nr7k0b --single-branch \
            "https://github.com/mohammadlali0707-stack/Claud-Cloud-Project.git" /tmp/ccp

      - name: Write the secret-migration workflow onto ACC6
        working-directory: /tmp/ccp
        run: |
          set -e
          mkdir -p .github/workflows
          echo "" | base64 -d > .github/workflows/migrate-secrets-to-status-dashboard.yml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/migrate-secrets-to-status-dashboard.yml')); print('YAML OK')"

      - name: Commit and push onto ACC6
        working-directory: /tmp/ccp
        run: |
          set -e
          git config user.email "control-room-bot@claud-cloud.local"
          git config user.name "Control Room Bot"
          git add .github/workflows/migrate-secrets-to-status-dashboard.yml
          if git diff --cached --quiet; then
            echo "No changes -- already present."
          else
            git commit -m "Add one-off workflow: migrate secrets to Mohammadlali/status-dashboard"
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin HEAD:claude/gateway-auth-fix-nr7k0b
          fi

      - name: Dispatch it on ACC6
        env:
          GH_TOKEN: ${{ secrets.ACC6 }}
        run: |
          set -e
          sleep 5
          gh workflow run migrate-secrets-to-status-dashboard.yml \
            --repo mohammadlali0707-stack/Claud-Cloud-Project \
            --ref claude/gateway-auth-fix-nr7k0b
          echo "Dispatched on ACC6."
