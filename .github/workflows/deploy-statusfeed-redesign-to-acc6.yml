name: Deploy Persian/RTL StatusFeed redesign to ACC6 (cross-account)

# StatusFeed/index.html, app.js and style.css were redrafted locally in
# an ACC0 checkout for the owner's Persian/RTL redesign request, but
# ACC0's own repo (Mohammadlali/Claud-Cloud-Project) no longer exists --
# deleted as the final step of the ACC0->ACC6 migration, confirmed via
# `git fetch` returning "repository ... not found". This session has no
# direct push access to ACC6 either (out of GitHub-tool scope), so
# delivery goes through this repo's own stored ACC6 PAT, same mechanism
# as every other ACC6 fix this session.
#
# The three real files are staged in THIS repo under
# .github/deploy-staging/statusfeed/ (pushed directly, no encoding
# tricks needed since that's a normal file push, not YAML). This job
# checks itself out to read them, then just copies them into the ACC6
# clone -- no base64 blobs embedded in this YAML at all.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DST_TOKEN: ${{ secrets.ACC6 }}
    steps:
      - name: Checkout control-room (to read the staged files)
        uses: actions/checkout@v4

      - name: Guard
        run: |
          if [ -z "$DST_TOKEN" ]; then
            echo "::error::secrets.ACC6 is not set on this repo."
            exit 1
          fi
          for f in index.html app.js style.css; do
            if [ ! -s ".github/deploy-staging/statusfeed/$f" ]; then
              echo "::error::staged file missing or empty: $f"
              exit 1
            fi
          done

      - name: Clone ACC6's Claud-Cloud-Project directly
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch claude/gateway-auth-fix-nr7k0b --single-branch \
            "https://github.com/mohammadlali0707-stack/Claud-Cloud-Project.git" /tmp/ccp

      - name: Copy the three redesigned files in and verify
        run: |
          set -e
          cp .github/deploy-staging/statusfeed/index.html /tmp/ccp/StatusFeed/index.html
          cp .github/deploy-staging/statusfeed/app.js /tmp/ccp/StatusFeed/app.js
          cp .github/deploy-staging/statusfeed/style.css /tmp/ccp/StatusFeed/style.css

          echo "=== Read the property back ==="
          grep -qF 'lang="fa" dir="rtl"' /tmp/ccp/StatusFeed/index.html || { echo "::error::index.html not RTL after copy"; exit 1; }
          grep -qF "toPersianDigits" /tmp/ccp/StatusFeed/app.js || { echo "::error::app.js missing Persian helper after copy"; exit 1; }
          grep -qF "Vazirmatn" /tmp/ccp/StatusFeed/style.css || { echo "::error::style.css missing Vazirmatn after copy"; exit 1; }
          diff -q .github/deploy-staging/statusfeed/index.html /tmp/ccp/StatusFeed/index.html
          diff -q .github/deploy-staging/statusfeed/app.js /tmp/ccp/StatusFeed/app.js
          diff -q .github/deploy-staging/statusfeed/style.css /tmp/ccp/StatusFeed/style.css
          echo "All three files verified byte-identical to the staged source."

      - name: Check for a real diff
        working-directory: /tmp/ccp
        run: |
          set -e
          if git diff --quiet; then
            echo "No diff -- already deployed."
            echo "ALREADY_DEPLOYED=true" >> "$GITHUB_ENV"
          else
            echo "ALREADY_DEPLOYED=false" >> "$GITHUB_ENV"
          fi

      - name: Record and push
        if: env.ALREADY_DEPLOYED == 'false'
        working-directory: /tmp/ccp
        run: |
          set -e
          echo "" | base64 -d >> Team/CHANGELOG.md
          git config user.email "control-room-bot@claud-cloud.local"
          git config user.name "Control Room Bot"
          git add StatusFeed/index.html StatusFeed/app.js StatusFeed/style.css Team/CHANGELOG.md
          COMMIT_MSG=$(printf 'Redesign StatusFeed to Persian/RTL, add older-log toggle\n\nDelivered via the Mohammadlali control-room cross-account mechanism; the ACC0 copy of this repo no longer exists.')
          git commit -m "$COMMIT_MSG"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin HEAD:claude/gateway-auth-fix-nr7k0b

      - name: Dispatch deploy-status-feed.yml on ACC6 to redeploy
        if: env.ALREADY_DEPLOYED == 'false'
        env:
          GH_TOKEN: ${{ secrets.ACC6 }}
        run: |
          set -e
          sleep 5
          gh workflow run deploy-status-feed.yml \
            --repo mohammadlali0707-stack/Claud-Cloud-Project \
            --ref claude/gateway-auth-fix-nr7k0b
          echo "Dispatched on ACC6."
