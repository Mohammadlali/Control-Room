name: Control-Room AGY Issue Bot

# Topic-routed as of 2026-09-11 (owner's instruction): an issue opened here
# is no longer always executed locally. Tools/route_topic.py classifies it
# first, against Team/company_scope.json:
#   - "control-room" -> unchanged behaviour below, dispatched round-robin
#     across ACC0..ACC8's own agw-workers fleet.
#   - any other project (tbs -> ACC6, airboxvip -> ACC1, ...) -> FORWARDED
#     as a fresh @agy issue on that project's own host repo, using that
#     account's own PAT. This repo never executes another project's work
#     itself -- see Team/COMPANY_SCOPE.md's "two hard rules".
#   - "unclear" -> no dispatch at all. The router refuses to guess; the
#     issue gets a comment asking for a `project:` label instead.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for AGY
        required: false
        type: string

permissions:
  issues: write
  contents: write

jobs:
  agy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.body, '@agy')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@agy') && github.event.comment.user.type != 'Bot')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Route by topic
        id: route
        if: github.event_name != 'workflow_dispatch'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          python3 Tools/route_topic.py \
            --title "$ISSUE_TITLE" --body "$ISSUE_BODY" --labels "$ISSUE_LABELS" \
            > /tmp/route.json
          cat /tmp/route.json
          DECISION=$(jq -r '.decision' /tmp/route.json)
          PROJECT=$(jq -r '.project // ""' /tmp/route.json)
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          if [ "$DECISION" = "route" ] && [ "$PROJECT" != "control-room" ] && [ "$PROJECT" != "status_dashboard" ]; then
            HOST_ACCOUNT=$(jq -r '.host_account' /tmp/route.json)
            HOST_REPO=$(jq -r '.host_repo' /tmp/route.json)
            HOST_LOGIN=$(jq -r --arg acc "$HOST_ACCOUNT" '.accounts[$acc].login' Team/company_scope.json)
            echo "host_account=$HOST_ACCOUNT" >> "$GITHUB_OUTPUT"
            echo "host_repo=$HOST_REPO" >> "$GITHUB_OUTPUT"
            echo "host_login=$HOST_LOGIN" >> "$GITHUB_OUTPUT"
          fi

      - name: Ack
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DECISION: ${{ steps.route.outputs.decision }}
          PROJECT: ${{ steps.route.outputs.project }}
          HOST_LOGIN: ${{ steps.route.outputs.host_login }}
          HOST_REPO: ${{ steps.route.outputs.host_repo }}
        run: |
          if [ "$DECISION" = "unclear" ]; then
            BODY='Could not tell which project this is about. Add a `project:` label (`project:tbs`, `project:airboxvip`, `project:control-room`, or `project:status_dashboard`) and reopen with a new `@agy` comment -- see Team/COMPANY_SCOPE.md.'
          elif [ "$PROJECT" != "control-room" ] && [ "$PROJECT" != "status_dashboard" ]; then
            BODY="Routed to $PROJECT ($HOST_LOGIN/$HOST_REPO) -- forwarding now, will link the mirrored issue here."
          else
            BODY='AGY is on it. Will reply when done.'
          fi
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      - name: Forward to another project's repo
        id: forward
        if: github.event_name != 'workflow_dispatch' && steps.route.outputs.decision == 'route' && steps.route.outputs.project != 'control-room' && steps.route.outputs.project != 'status_dashboard'
        env:
          HOST_LOGIN: ${{ steps.route.outputs.host_login }}
          HOST_REPO: ${{ steps.route.outputs.host_repo }}
          HOST_ACCOUNT: ${{ steps.route.outputs.host_account }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ACC0: ${{ secrets.ACC0 }}
          ACC1: ${{ secrets.ACC1 }}
          ACC2: ${{ secrets.ACC2 }}
          ACC3: ${{ secrets.ACC3 }}
          ACC4: ${{ secrets.ACC4 }}
          ACC5: ${{ secrets.ACC5 }}
          ACC6: ${{ secrets.ACC6 }}
          ACC7: ${{ secrets.ACC7 }}
          ACC8: ${{ secrets.ACC8 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          eval "TOKEN=\$${HOST_ACCOUNT}"
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          {
            printf '@agy %s\n\n' "$SAFE_TITLE"
            printf '%s\n\n' "$SAFE_BODY"
            printf '_Forwarded from Control-Room#%s by the topic router (Team/route_topic.py)._\n' "$ISSUE_NUM"
          } > /tmp/forward_body.txt
          FWD_URL=$(GH_TOKEN="$TOKEN" gh issue create \
            --repo "$HOST_LOGIN/$HOST_REPO" \
            --title "$SAFE_TITLE" \
            --body-file /tmp/forward_body.txt)
          echo "forward_url=$FWD_URL" >> "$GITHUB_OUTPUT"
          gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" \
            --body "Forwarded: $FWD_URL"
          gh issue close "$ISSUE_NUM" --repo "${{ github.repository }}" \
            --reason "not planned" \
            --comment "Tracked at $FWD_URL from here on -- closing the Control-Room copy, not the work."

      - name: Build prompt
        id: prompt
        if: steps.route.outputs.decision != 'unclear' && steps.route.outputs.project != 'tbs' && steps.route.outputs.project != 'airboxvip'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          BRANCH='main'
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          SAFE_COMMENT=$(printf '%s' "$COMMENT_BODY" | sanitize)
          README=$(cat README.md 2>/dev/null | sanitize | head -50 || printf '%s' '(not found)')
          {
            printf '%s\n' 'You are AGY, an AI software engineer for Control-Room.'
            printf '%s\n' 'Control-Room is the central management repo for a 9-account GitHub org (ACC0-ACC8). ACC0 handles management only; no other project ever runs here.'
            printf 'Active branch: %s\n' "$BRANCH"
            printf '%s\n' ''
            printf '%s\n' '=== WORKING TREE ==='
            printf '%s\n' 'The current directory is already a clone of this repo on the active branch.'
            printf '%s\n' 'You have NO git credential and NO GitHub API token in your environment -- do'
            printf '%s\n' 'not attempt to authenticate to GitHub, and do not ask for a token. Edit files,'
            printf '%s\n' 'then run:'
            printf '%s\n' "  git config user.email 'agy-bot@control-room.local'"
            printf '%s\n' "  git config user.name 'AGY Bot'"
            printf '%s\n' "  git add -A && git commit -m 'message'"
            printf '%s\n' 'Do NOT run git push and do NOT call any GitHub API yourself -- the pipeline'
            printf '%s\n' 'running you pushes your commit and posts your final output as the issue'
            printf '%s\n' 'comment on its own, after you finish, using a credential you never see.'
            printf '%s\n' ''
            printf '%s\n' '=== PROJECT README ==='
            printf '%s\n' "$README"
            printf '%s\n' ''
            printf 'TASK - Issue #%s: %s\n' "$ISSUE_NUM" "$SAFE_TITLE"
            printf '%s\n' "$SAFE_BODY"
            if [ -n "$SAFE_COMMENT" ]; then
              printf '%s\n' ''
              printf '%s\n' 'LATEST COMMENT:'
              printf '%s\n' "$SAFE_COMMENT"
            fi
            printf '%s\n' ''
            printf '%s\n' '=== REQUIRED STEPS ==='
            printf '%s\n' 'STEP 0: Read the files relevant to this task and print a short DETAILED'
            printf '%s\n' '  planning checklist to stdout (exact file + function + evidence per item).'
            printf '%s\n' '  This is printed output only -- do not post it anywhere yourself.'
            printf '%s\n' 'STEP 1: Implement the task.'
            printf '%s\n' 'STEP 2: python3 Tools/run_gates.py (must pass).'
            printf '%s\n' 'STEP 3: Update Team/CHANGELOG.md'
            printf '%s\n' "STEP 4: git add -A && git commit -m 'message'  (no push -- see above)"
            printf '%s\n' 'STEP 5: Print a final report to stdout, including the commit hash you made.'
          } > /tmp/prompt.txt
          ACC_IDX=$(( ISSUE_NUM % 9 ))
          echo "acc_index=$ACC_IDX" >> "$GITHUB_OUTPUT"

      - name: Dispatch, wait and collect
        id: dispatch
        if: steps.prompt.outcome == 'success'
        env:
          ACC0: ${{ secrets.ACC0 }}
          ACC1: ${{ secrets.ACC1 }}
          ACC2: ${{ secrets.ACC2 }}
          ACC3: ${{ secrets.ACC3 }}
          ACC4: ${{ secrets.ACC4 }}
          ACC5: ${{ secrets.ACC5 }}
          ACC6: ${{ secrets.ACC6 }}
          ACC7: ${{ secrets.ACC7 }}
          ACC8: ${{ secrets.ACC8 }}
        run: |
          ACC_IDX="${{ steps.prompt.outputs.acc_index }}"
          case $ACC_IDX in
            0) DISPATCH_REPO="Mohammadlali/agw-workers";           DISPATCH_TOKEN="$ACC0" ;;
            1) DISPATCH_REPO="momonakikugava-pixel/agw-workers";   DISPATCH_TOKEN="$ACC1" ;;
            2) DISPATCH_REPO="lali94m-max/agw-workers";            DISPATCH_TOKEN="$ACC2" ;;
            3) DISPATCH_REPO="ngocgminh5-debug/agw-workers";       DISPATCH_TOKEN="$ACC3" ;;
            4) DISPATCH_REPO="hmmletssee7-design/agw-workers";     DISPATCH_TOKEN="$ACC4" ;;
            5) DISPATCH_REPO="kidding602/agw-workers";             DISPATCH_TOKEN="$ACC5" ;;
            6) DISPATCH_REPO="mohammadlali0707-stack/agw-workers"; DISPATCH_TOKEN="$ACC6" ;;
            7) DISPATCH_REPO="mohammad97okk/agw-workers";          DISPATCH_TOKEN="$ACC7" ;;
            8) DISPATCH_REPO="moradzahra85-png/agw-workers";       DISPATCH_TOKEN="$ACC8" ;;
          esac
          export GH_TOKEN="$DISPATCH_TOKEN"
          echo "Dispatching issue #${{ github.event.issue.number }} to $DISPATCH_REPO (acc=$ACC_IDX)"
          PROMPT=$(cat /tmp/prompt.txt)
          CALLBACK_ID="cr-${{ github.event.issue.number }}-${{ github.run_id }}"
          gh workflow run agw-worker.yml \
            --repo "$DISPATCH_REPO" \
            --field "prompt=$PROMPT" \
            --field "target_repo=Mohammadlali/Control-Room" \
            --field "target_branch=main" \
            --field "acc_index=$(( ACC_IDX + 1 ))" \
            --field "callback_id=$CALLBACK_ID"
          sleep 10
          RUN_ID=$(gh run list --repo "$DISPATCH_REPO" \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "dispatch_repo=$DISPATCH_REPO" >> "$GITHUB_OUTPUT"

          for i in $(seq 1 40); do
            ST=$(gh run view "$RUN_ID" --repo "$DISPATCH_REPO" --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

          # Fetch the agent's raw output from THIS repo's own content
          # (Reports/agy/<callback_id>.txt, committed by agw-worker.yml as
          # part of its push) via the Contents API, instead of
          # `gh run download`. That pulled a PUBLIC Actions artifact off
          # the dispatch repo (agw-workers), which is a public repo with
          # no relation to who is allowed to read this issue -- the
          # Contents API call below reads from Control-Room itself, under
          # this repo's own access rules.
          GH_TOKEN="$ACC0" gh api "repos/Mohammadlali/Control-Room/contents/Reports/agy/${CALLBACK_ID}.txt" \
            --jq '.content' 2>/dev/null | base64 -d > /tmp/final_raw.txt || true
          if [ -s /tmp/final_raw.txt ]; then
            head -c 58000 /tmp/final_raw.txt > /tmp/final.txt
          else
            printf '%s\n' '(no output found -- the worker may have failed before it could commit its output)' > /tmp/final.txt
          fi

      - name: Post result
        if: github.event_name != 'workflow_dispatch' && steps.dispatch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKER_URL="https://github.com/${{ steps.dispatch.outputs.dispatch_repo }}/actions/runs/${{ steps.dispatch.outputs.run_id }}"
          printf '%s\n\n---\n*AGY worker: %s | acc: ${{ steps.prompt.outputs.acc_index }}*\n' "$(cat /tmp/final.txt)" "$WORKER_URL" > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/comment.txt
