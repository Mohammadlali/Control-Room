name: Control-Room AGY Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for AGY
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  agy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@agy')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agy') && github.event.comment.user.type != 'Bot')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ack comment
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **AGY is on it.** Will reply when done."

      - name: Build safe prompt
        id: prompt
        env:
          CTRL_TOKEN: ${{ secrets.CONTROL_ROOM_PAT }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          REPO='mohammadlali0707-stack/Control-Room'
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`"\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          AGENTS=$(cat AGENTS.md 2>/dev/null | sanitize || printf '%s' '(not found)')
          WHERE=$(cat Team/WHERE_WE_ARE.md 2>/dev/null | sanitize || printf '%s' '(not found)')
          {
            printf '%s\n' '=== EXECUTION MODE (MANDATORY) ==='
            printf '%s\n' 'Run ALL steps SEQUENTIALLY. Do NOT spawn subagents or timers.'
            printf '%s\n' ''
            printf '%s\n' '=== CREDENTIALS ==='
            printf 'CTRL_TOKEN: %s\n' "$CTRL_TOKEN"
            printf 'REPO: %s\n' "$REPO"
            printf 'ISSUE_NUM: %s\n' "$ISSUE_NUM"
            printf '%s\n' ''
            printf '%s\n' '=== GIT SETUP ==='
            printf 'git clone https://x-access-token:%s@github.com/%s.git /tmp/cr\n' "$CTRL_TOKEN" "$REPO"
            printf '%s\n' "cd /tmp/cr"
            printf '%s\n' "git config user.email 'agy-bot@control-room.local'"
            printf '%s\n' "git config user.name 'AGY Bot'"
            printf '%s\n' ''
            printf '%s\n' '=== AGENTS.md ==='
            printf '%s\n' "$AGENTS"
            printf '%s\n' ''
            printf '%s\n' '=== WHERE_WE_ARE.md ==='
            printf '%s\n' "$WHERE"
            printf '%s\n' ''
            printf 'TASK - Issue #%s: %s\n' "$ISSUE_NUM" "$SAFE_TITLE"
            printf '%s\n' "$SAFE_BODY"
            printf '%s\n' ''
            printf '%s\n' '=== REQUIRED STEPS ==='
            printf '%s\n' ''
            printf '%s\n' 'STEP 0: Post planning checklist BEFORE any work.'
            printf '%s\n' '  Analyze task. Break into 3-7 concrete sub-tasks.'
            printf '%s\n' '  Use GitHub REST API to post a checklist comment on the issue:'
            printf '  POST https://api.github.com/repos/%s/issues/%s/comments\n' "$REPO" "$ISSUE_NUM"
            printf '%s\n' '  Header: Authorization: Bearer CTRL_TOKEN'
            printf '%s\n' '  Body field: body (markdown):'
            printf '%s\n' '    ### Working on it'
            printf '%s\n' '    **Todo list**'
            printf '%s\n' '    - [ ] Gather context and verify claims'
            printf '%s\n' '    - [ ] Task 1: describe'
            printf '%s\n' '    - [ ] Run gates'
            printf '%s\n' '    - [ ] Final consolidated report'
            printf '%s\n' '  Save the comment id from the response.'
            printf '%s\n' '  After each sub-task, PATCH the comment to tick completed checkboxes:'
            printf '  PATCH https://api.github.com/repos/%s/issues/comments/COMMENT_ID_HERE\n' "$REPO"
            printf '%s\n' '  Update body: change done items from [ ] to [x]. Do this after EACH task.'
            printf '%s\n' ''
            printf '%s\n' 'STEP 1: Clone (GIT SETUP above). Tick Gather context checkbox.'
            printf '%s\n' 'STEP 2: Complete all tasks in issue body. Tick each checkbox immediately after.'
            printf '%s\n' 'STEP 3: python3 Tools/run_gates.py (all must pass). Tick Run gates.'
            printf '%s\n' 'STEP 4: Update Team/CHANGELOG.md with real commit hash.'
            printf '%s\n' 'STEP 5: git add -A and git commit and git push origin main'
            printf '%s\n' 'STEP 6: Tick Final report checkbox. Post final report comment:'
            printf '  POST https://api.github.com/repos/%s/issues/%s/comments\n' "$REPO" "$ISSUE_NUM"
            printf '%s\n' '  Format:'
            printf '%s\n' '    Done'
            printf '%s\n' '    Push lines: paste exact git push output'
            printf '%s\n' '    1. Task: evidence (commit hash, file, count)'
            printf '%s\n' '    Gate count: X pass, 0 fail'
          } > /tmp/prompt.txt
          printf 'Prompt: %s lines\n' "$(wc -l < /tmp/prompt.txt)"

      - name: Dispatch to agw-workers
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          ACC_LABEL=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels \
            -q '.labels[].name' | grep '^agy-acc:' | head -1 || echo "")
          ACC_INDEX="0"
          [ -n "$ACC_LABEL" ] && ACC_INDEX="${ACC_LABEL#agy-acc:}"
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo Mohammadlali/agw-workers \
            --field "prompt=$PROMPT" \
            --field "acc_index=$ACC_INDEX" \
            --field "callback_id=cr-$ISSUE_NUM-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list --repo Mohammadlali/agw-workers \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched: $RUN_ID (acc=$ACC_INDEX)"

      - name: Wait for worker
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          for i in $(seq 1 40); do
            ST=$(gh run view "$RID" --repo Mohammadlali/agw-workers --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

      - name: Download result
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          mkdir -p /tmp/agy-out
          gh run download "$RID" --repo Mohammadlali/agw-workers --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          [ -n "$OUT" ] && head -c 58000 "$OUT" > /tmp/final.txt || echo "(no output)" > /tmp/final.txt

      - name: Post result
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN: ${{ steps.dispatch.outputs.run_id }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "AGY output: $(cat /tmp/final.txt) -- run: https://github.com/Mohammadlali/agw-workers/actions/runs/$WORKER_RUN"
