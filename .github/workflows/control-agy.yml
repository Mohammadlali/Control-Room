name: Control-Room AGY Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for AGY
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  agy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@agy')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agy') && github.event.comment.user.type != 'Bot')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ack comment
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **AGY is on it.** Will reply when done."

      - name: Build safe prompt
        id: prompt
        env:
          CTRL_TOKEN: ${{ secrets.CONTROL_ROOM_PAT }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          REPO="mohammadlali0707-stack/Control-Room"
          # Sanitize: replace backticks, double quotes, $(), ${} to avoid shell injection
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`"\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          AGENTS=$(cat AGENTS.md 2>/dev/null | sanitize || echo '(not found)')
          WHERE=$(cat Team/WHERE_WE_ARE.md 2>/dev/null | sanitize || echo '(not found)')
          TOKEN="$CTRL_TOKEN"
          cat > /tmp/prompt.txt << ENDOFPROMPT
=== EXECUTION MODE (MANDATORY) ===
Run ALL steps SEQUENTIALLY. Do NOT spawn subagents, timers, or background tasks.

=== CREDENTIALS ===
CTRL_TOKEN: $TOKEN
REPO: $REPO
ISSUE_NUM: $ISSUE_NUM

=== GIT SETUP ===
git clone https://x-access-token:${TOKEN}@github.com/${REPO}.git /tmp/cr
cd /tmp/cr
git config user.email 'agy-bot@control-room.local'
git config user.name 'AGY Bot'

=== AGENTS.md ===
$AGENTS

=== WHERE_WE_ARE.md ===
$WHERE

=== TASK - Issue #$ISSUE_NUM: $SAFE_TITLE ===
$SAFE_BODY

=== REQUIRED STEPS ===

STEP 0: Post a planning checklist comment BEFORE any other work.
  - Analyze the task and write 3-7 concrete sub-tasks.
  - Post a comment to: POST https://api.github.com/repos/$REPO/issues/$ISSUE_NUM/comments
  - Use Authorization header: Bearer plus the CTRL_TOKEN value above.
  - Comment body (markdown):
      ### Working on it
      **Todo list**
      - [ ] Gather context and verify claims
      - [ ] Task 1: describe specific task
      - [ ] Task 2: describe specific task
      - [ ] Run gates
      - [ ] Final consolidated report
  - Save the returned comment id for PATCH updates.
  - After each sub-task completes, PATCH the comment:
      PATCH https://api.github.com/repos/$REPO/issues/comments/COMMENT_ID_HERE
      Update the body to change completed items from [ ] to [x].
      Tick only completed items. Do this after EACH task, not just at end.

STEP 1: Clone repo (see GIT SETUP above). Tick 'Gather context' in checklist.

STEP 2: Complete ALL tasks from the issue body. Tick each checkbox after completion.

STEP 3: Run gates: python3 Tools/run_gates.py (all must pass). Tick 'Run gates'.

STEP 4: Update Team/CHANGELOG.md with real commit hash.

STEP 5: git add -A and git commit and git push origin main.

STEP 6: Tick 'Final consolidated report'. Post final report:
  - POST https://api.github.com/repos/$REPO/issues/$ISSUE_NUM/comments
  - Format:
      Done
      Push lines: paste exact git push output here
      1. Task name: what you found, changed, why. Evidence: hash, file, count.
      Gate count: X pass, 0 fail.
ENDOFPROMPT
          echo "Prompt: $(wc -l < /tmp/prompt.txt) lines"

      - name: Dispatch to agw-workers
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          ACC_LABEL=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels \
            -q '.labels[].name' | grep '^agy-acc:' | head -1 || echo "")
          ACC_INDEX="0"
          [ -n "$ACC_LABEL" ] && ACC_INDEX="${ACC_LABEL#agy-acc:}"
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo Mohammadlali/agw-workers \
            --field "prompt=$PROMPT" \
            --field "acc_index=$ACC_INDEX" \
            --field "callback_id=cr-$ISSUE_NUM-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list --repo Mohammadlali/agw-workers \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched: $RUN_ID (acc=$ACC_INDEX)"

      - name: Wait for worker
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          for i in $(seq 1 40); do
            ST=$(gh run view "$RID" --repo Mohammadlali/agw-workers --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

      - name: Download result
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          mkdir -p /tmp/agy-out
          gh run download "$RID" --repo Mohammadlali/agw-workers --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          [ -n "$OUT" ] && head -c 58000 "$OUT" > /tmp/final.txt || echo "(no output)" > /tmp/final.txt

      - name: Post result
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN: ${{ steps.dispatch.outputs.run_id }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "AGY output: $(cat /tmp/final.txt) -- run: https://github.com/Mohammadlali/agw-workers/actions/runs/$WORKER_RUN"
