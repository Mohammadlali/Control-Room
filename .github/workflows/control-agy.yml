name: Control-Room AGY Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for AGY
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  agy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.body, '@agy') ||
      contains(github.event.comment.body, '@agy')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ack comment
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **AGY is on it.** Will reply when done."

      - name: Build prompt file
        run: |
          {
            echo "=== GOVERNANCE ==="
            cat AGENTS.md 2>/dev/null || true
            echo ""
            echo "=== STATE ==="
            cat Team/WHERE_WE_ARE.md 2>/dev/null || true
            echo ""
            echo "=== TASK ==="
            echo "Issue: ${{ github.event.issue.title }}"
            echo "${{ github.event.issue.body }}"
            echo "${{ github.event.comment.body }}"
            echo ""
            echo "=== RULES ==="
            echo "1. Do the task."
            echo "2. Run python Tools/run_gates.py — must pass."
            echo "3. Record commits in Team/CHANGELOG.md."
            echo "4. Push to main."
            echo "5. End with a plain-English summary."
          } > /tmp/prompt.txt
          wc -l /tmp/prompt.txt

      - name: Dispatch to agw-workers
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo Mohammadlali/agw-workers \
            --field "prompt=$PROMPT" \
            --field "acc_index=0" \
            --field "callback_id=cr-${{ github.event.issue.number }}-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list \
            --repo Mohammadlali/agw-workers \
            --workflow agw-worker.yml \
            --limit 1 \
            --json databaseId \
            -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched: $RUN_ID"

      - name: Wait for worker
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          for i in $(seq 1 40); do
            ST=$(gh run view "$RID" \
              --repo Mohammadlali/agw-workers \
              --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

      - name: Download result
        id: result
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          mkdir -p /tmp/agy-out
          gh run download "$RID" \
            --repo Mohammadlali/agw-workers \
            --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          if [ -n "$OUT" ]; then
            head -c 58000 "$OUT" > /tmp/final.txt
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "(no output)" > /tmp/final.txt
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post result
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN: ${{ steps.dispatch.outputs.run_id }}
        run: |
          BODY=$(cat /tmp/final.txt)
          RUN_URL="https://github.com/Mohammadlali/agw-workers/actions/runs/$WORKER_RUN"
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "AGY output: $BODY -- run: $RUN_URL"
