name: Control-Room AGY Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for AGY
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  agy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.body, '@agy') ||
      contains(github.event.comment.body, '@agy')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ack comment
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **AGY is on it.** Will reply when done."

      - name: Build safe prompt
        id: prompt
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          REPO="mohammadlali0707-stack/Control-Room"
          RAW_TITLE="${{ github.event.issue.title }}"
          SAFE_TITLE=$(printf '%s' "$RAW_TITLE" | tr -d '`"\\$')
          RAW_BODY="${{ github.event.issue.body }}"
          SAFE_BODY=$(printf '%s' "$RAW_BODY" | sed "s/\`/'/g; s/\"/'/g")

          # Sanitize files: remove chars that break bash double-quoted strings
          sanitize_file() {
            sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"
          }
          AGENTS=$(cat AGENTS.md 2>/dev/null | sanitize_file || echo "(not found)")
          WHERE=$(cat Team/WHERE_WE_ARE.md 2>/dev/null | sanitize_file || echo "(not found)")

          {
            echo "You are an AI assistant for the $REPO GitHub repository."
            echo "Respond to the issue below. Use ONLY the provided context — do NOT clone or access external repos."
            echo ""
            echo "--- AGENTS.md (governance rules) ---"
            echo "$AGENTS"
            echo ""
            echo "--- WHERE_WE_ARE.md (current project state) ---"
            echo "$WHERE"
            echo ""
            echo "--- ISSUE #$ISSUE_NUM: $SAFE_TITLE ---"
            echo "$SAFE_BODY"
            echo ""
            echo "--- YOUR RESPONSE ---"
            echo "Write a clear, helpful reply to this issue based on the context above."
            echo "If code changes are needed, describe them clearly."
            echo "End with: DONE."
          } > /tmp/prompt.txt
          echo "Prompt ready: $(wc -l < /tmp/prompt.txt) lines"
          head -5 /tmp/prompt.txt

      - name: Dispatch to agw-workers
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo Mohammadlali/agw-workers \
            --field "prompt=$PROMPT" \
            --field "acc_index=0" \
            --field "callback_id=cr-${{ github.event.issue.number }}-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list \
            --repo Mohammadlali/agw-workers \
            --workflow agw-worker.yml \
            --limit 1 \
            --json databaseId \
            -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched: $RUN_ID"

      - name: Wait for worker
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          for i in $(seq 1 40); do
            ST=$(gh run view "$RID" \
              --repo Mohammadlali/agw-workers \
              --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

      - name: Download result
        id: result
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          mkdir -p /tmp/agy-out
          gh run download "$RID" \
            --repo Mohammadlali/agw-workers \
            --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          if [ -n "$OUT" ]; then
            head -c 58000 "$OUT" > /tmp/final.txt
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "(no output)" > /tmp/final.txt
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post result
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN: ${{ steps.dispatch.outputs.run_id }}
        run: |
          BODY=$(cat /tmp/final.txt)
          RUN_URL="https://github.com/Mohammadlali/agw-workers/actions/runs/$WORKER_RUN"
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "AGY output: $BODY -- run: $RUN_URL"
