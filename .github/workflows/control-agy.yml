name: Control-Room AGY Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for AGY
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  agy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@agy')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agy') && github.event.comment.user.type != 'Bot')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ack comment
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 **AGY is on it.** Will reply when done."

      - name: Build safe prompt
        id: prompt
        env:
          CTRL_TOKEN: ${{ secrets.CONTROL_ROOM_PAT }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          REPO="mohammadlali0707-stack/Control-Room"
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`"\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g")
          sanitize_file() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          AGENTS=$(cat AGENTS.md 2>/dev/null | sanitize_file || echo "(not found)")
          WHERE=$(cat Team/WHERE_WE_ARE.md 2>/dev/null | sanitize_file || echo "(not found)")
          {
            echo "=== EXECUTION MODE (MANDATORY) ==="
            echo "Run ALL steps SEQUENTIALLY. DO NOT spawn subagents, timers, or background tasks."
            echo ""
            echo "=== GIT SETUP ==="
            echo "git clone https://x-access-token:$CTRL_TOKEN@github.com/$REPO.git /tmp/cr"
            echo "cd /tmp/cr"
            echo "git config user.email 'agy-bot@control-room.local'"
            echo "git config user.name 'AGY Bot'"
            echo ""
            echo "=== AGENTS.md ==="
            echo "$AGENTS"
            echo ""
            echo "=== WHERE_WE_ARE.md ==="
            echo "$WHERE"
            echo ""
            echo "=== TASK - Issue #$ISSUE_NUM: $SAFE_TITLE ==="
            echo "$SAFE_BODY"
            echo ""
            echo "=== REQUIRED STEPS (execute in order, no skipping) ==="
            echo ""
            echo "STEP 0 -- Post planning checklist BEFORE any work:"
            echo "  a) Analyze the task. Write a list of 3-7 concrete sub-tasks."
            echo "  b) Post a checklist comment on issue #$ISSUE_NUM and capture the comment ID:"
            echo "     COMMENT_URL=\$(gh issue comment '$ISSUE_NUM' --repo '$REPO' --body '### Working on it :red_circle:\n**Todo list**\n- [ ] Gather context and verify claims by measurement\n- [ ] Task 1: <describe>\n- [ ] Task 2: <describe>\n- [ ] Run gates\n- [ ] Final consolidated report')"
            echo "     COMMENT_ID=\$(echo \"\$COMMENT_URL\" | grep -oE '[0-9]+\$')"
            echo "  c) After EACH task below completes, immediately edit the comment to tick that checkbox:"
            echo "     Use this command to update the comment body:"
            echo "     gh api 'repos/$REPO/issues/comments/\$COMMENT_ID' -X PATCH -f body='### Working on it :red_circle:\n**Todo list**\n- [x] Completed task\n- [ ] Next task\n...'"
            echo "     Replace the exact text: change '- [ ] <that task>' to '- [x] <that task>'."
            echo "     Keep all other checkboxes unchanged."
            echo "     Do this after EVERY completed task, not just at the end."
            echo ""
            echo "STEP 1 -- Clone repo via GIT SETUP above."
            echo "  After: tick 'Gather context' checkbox in the comment."
            echo ""
            echo "STEP 2 -- Complete ALL tasks described in the issue."
            echo "  After each sub-task: tick its checkbox in the comment immediately."
            echo ""
            echo "STEP 3 -- Run: python Tools/run_gates.py (ALL gates must pass)."
            echo "  After: tick 'Run gates' checkbox in the comment."
            echo ""
            echo "STEP 4 -- Add entry to Team/CHANGELOG.md with real commit hash."
            echo "STEP 5 -- git add -A && git commit -m 'your message' && git push origin main"
            echo ""
            echo "STEP 6 -- Post FINAL COMPREHENSIVE REPORT as a new comment on issue #$ISSUE_NUM."
            echo "  First: tick 'Final consolidated report' checkbox in the planning comment."
            echo "  Then post a new comment in this format:"
            echo "  ---"
            echo "  **Done**"
            echo ""
            echo "  **Push lines** (branch <branch>, target main):"
            echo "  <paste exact output from git push>"
            echo ""
            echo "  For each completed task (numbered 1, 2, 3...):"
            echo "  1. <Task name>"
            echo "     What you found, what you changed, why."
            echo "     Evidence: commit hashes, file names, exact line counts, run IDs."
            echo "     No vague statements. Every claim must be verifiable."
            echo ""
            echo "  **Gate count, honestly:**"
            echo "  X gates: X pass, 0 fail. (before this session: Y pass)"
            echo "  ---"
          } > /tmp/prompt.txt
          echo "Prompt: $(wc -l < /tmp/prompt.txt) lines"

      - name: Dispatch to agw-workers
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          ACC_LABEL=$(gh issue view "$ISSUE_NUM" --repo "$REPO" --json labels \
            -q '.labels[].name' | grep '^agy-acc:' | head -1 || echo "")
          ACC_INDEX="0"
          [ -n "$ACC_LABEL" ] && ACC_INDEX="${ACC_LABEL#agy-acc:}"
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo Mohammadlali/agw-workers \
            --field "prompt=$PROMPT" \
            --field "acc_index=$ACC_INDEX" \
            --field "callback_id=cr-$ISSUE_NUM-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list --repo Mohammadlali/agw-workers \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched: $RUN_ID (acc=$ACC_INDEX)"

      - name: Wait for worker
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          for i in $(seq 1 40); do
            ST=$(gh run view "$RID" --repo Mohammadlali/agw-workers --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

      - name: Download result
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          mkdir -p /tmp/agy-out
          gh run download "$RID" --repo Mohammadlali/agw-workers --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          [ -n "$OUT" ] && head -c 58000 "$OUT" > /tmp/final.txt || echo "(no output)" > /tmp/final.txt

      - name: Post result
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKER_RUN: ${{ steps.dispatch.outputs.run_id }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "AGY output: $(cat /tmp/final.txt) -- run: https://github.com/Mohammadlali/agw-workers/actions/runs/$WORKER_RUN"
