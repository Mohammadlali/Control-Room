name: Control-Room AGY Issue Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: Prompt for AGY
        required: false
        type: string

permissions:
  issues: write
  contents: write

jobs:
  agy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && startsWith(github.event.issue.body, '@agy')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@agy') && github.event.comment.user.type != 'Bot')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ack
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "AGY is on it. Will reply when done."

      - name: Build prompt
        id: prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          REPO='mohammadlali0707-stack/Control-Room'
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_TITLE=$(printf '%s' "$ISSUE_TITLE" | tr -d '`\\$')
          SAFE_BODY=$(printf '%s' "$ISSUE_BODY" | sanitize)
          SAFE_COMMENT=$(printf '%s' "$COMMENT_BODY" | sanitize)
          README=$(cat README.md 2>/dev/null | sanitize | head -50 || printf '%s' '(not found)')
          {
            printf '%s\n' 'You are AGY, an AI software engineer for the Control-Room repository.'
            printf '%s\n' 'Control-Room is an autonomous infrastructure for managing GitHub projects with AI.'
            printf '%s\n' ''
            printf '%s\n' '=== CREDENTIALS ==='
            printf 'REPO: %s\n' "$REPO"
            printf 'ISSUE_NUM: %s\n' "$ISSUE_NUM"
            printf '%s\n' 'REPO_TOKEN: use secret CONTROL_ROOM_PAT from your worker environment (never print it)'
            printf '%s\n' ''
            printf '%s\n' '=== GIT SETUP ==='
            printf '%s\n' 'git clone https://x-access-token:${CONTROL_ROOM_PAT}@github.com/mohammadlali0707-stack/Control-Room.git /tmp/repo'
            printf '%s\n' 'cd /tmp/repo'
            printf '%s\n' "git config user.email 'agy-bot@control-room.local'"
            printf '%s\n' "git config user.name 'AGY Bot'"
            printf '%s\n' ''
            printf '%s\n' '=== PROJECT README ==='
            printf '%s\n' "$README"
            printf '%s\n' ''
            printf 'TASK - Issue #%s: %s\n' "$ISSUE_NUM" "$SAFE_TITLE"
            printf '%s\n' "$SAFE_BODY"
            if [ -n "$SAFE_COMMENT" ]; then
              printf '%s\n' ''
              printf '%s\n' 'LATEST COMMENT:'
              printf '%s\n' "$SAFE_COMMENT"
            fi
            printf '%s\n' ''
            printf '%s\n' '=== REQUIRED STEPS ==='
            printf '%s\n' ''
            printf '%s\n' 'STEP 0: Clone repo. Read relevant files. Post a DETAILED planning checklist.'
            printf '%s\n' ''
            printf '%s\n' '  CHECKLIST REQUIREMENTS:'
            printf '%s\n' '  - Each item must name the EXACT file(s) and function(s) involved'
            printf '%s\n' '  - Each item must state what you will DO and what evidence proves it done'
            printf '%s\n' '  - BAD:  - [ ] Understand task'
            printf '%s\n' '  - BAD:  - [ ] Implement changes'
            printf '%s\n' '  - GOOD: - [ ] Read `Tools/run_gates.py`: confirm GATES list has N entries'
            printf '%s\n' '  - GOOD: - [ ] Add `check_foo()` to `Tools/check_foo.py`: returns 0 on pass, 1 on fail'
            printf '%s\n' ''
            printf '%s\n' '  POST to: https://api.github.com/repos/mohammadlali0707-stack/Control-Room/issues/ISSUE_NUM/comments'
            printf '%s\n' '  Auth: Bearer ${CONTROL_ROOM_PAT}'
            printf '%s\n' '  Format:'
            printf '%s\n' '    ## Working'
            printf '%s\n' '    > <one-line current status>'
            printf '%s\n' '    ## Todo'
            printf '%s\n' '    - [ ] Read `<file>`: verify <finding>'
            printf '%s\n' '    - [ ] Implement `<fn>` in `<file>`'
            printf '%s\n' '    - [ ] Run `python3 Tools/run_gates.py`: all gates pass'
            printf '%s\n' '    - [ ] Update `Team/CHANGELOG.md`'
            printf '%s\n' '    - [ ] Commit: `<type>: <desc>`'
            printf '%s\n' '    - [ ] Post final report with commit hash'
            printf '%s\n' ''
            printf '%s\n' '  PATCH comment_id to tick [x] after each step.'
            printf '%s\n' ''
            printf '%s\n' 'STEP 1: Implement all tasks.'
            printf '%s\n' 'STEP 2: Run gates: python3 Tools/run_gates.py (must pass).'
            printf '%s\n' 'STEP 3: Update Team/CHANGELOG.md.'
            printf '%s\n' 'STEP 4: git add -A && git commit && git push origin main'
            printf '%s\n' 'STEP 5: Post final report with commit hash and summary table.'
          } > /tmp/prompt.txt
          printf 'Prompt: %s lines\n' "$(wc -l < /tmp/prompt.txt)"
          ACC_IDX=$(( ISSUE_NUM % 9 ))
          echo "acc_index=$ACC_IDX" >> "$GITHUB_OUTPUT"

      - name: Dispatch to agw-workers
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo Mohammadlali/agw-workers \
            --field "prompt=$PROMPT" \
            --field "acc_index=${{ steps.prompt.outputs.acc_index }}" \
            --field "callback_id=cr-${{ github.event.issue.number }}-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list --repo Mohammadlali/agw-workers \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for worker
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          for i in $(seq 1 40); do
            ST=$(gh run view "$RID" --repo Mohammadlali/agw-workers --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

      - name: Download and post result
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOHAMMADLALI_PAT: ${{ secrets.MOHAMMADLALI_PAT }}
          WORKER_RUN: ${{ steps.dispatch.outputs.run_id }}
        run: |
          mkdir -p /tmp/agy-out
          GH_TOKEN="$MOHAMMADLALI_PAT" gh run download "$WORKER_RUN" \
            --repo Mohammadlali/agw-workers --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          [ -n "$OUT" ] && head -c 58000 "$OUT" > /tmp/final.txt || printf '%s\n' '(no output)' > /tmp/final.txt
          WORKER_URL="https://github.com/Mohammadlali/agw-workers/actions/runs/$WORKER_RUN"
          printf '%s\n\n---\n*AGY worker: %s | acc: ${{ steps.prompt.outputs.acc_index }}*\n' "$(cat /tmp/final.txt)" "$WORKER_URL" > /tmp/comment.txt
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/comment.txt
