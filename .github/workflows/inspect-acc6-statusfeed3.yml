name: Inspect ACC6 StatusFeed source pt3 (rest of collect_status_feed.py + send_push_notification.py)

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DST_TOKEN: ${{ secrets.ACC6 }}
    steps:
      - name: Clone ACC6's Claud-Cloud-Project directly
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch claude/gateway-auth-fix-nr7k0b --single-branch \
            "https://github.com/mohammadlali0707-stack/Claud-Cloud-Project.git" /tmp/ccp
          wc -l /tmp/ccp/Tools/collect_status_feed.py /tmp/ccp/Tools/send_push_notification.py > /tmp/wc.txt 2>&1 || true
          cat /tmp/wc.txt

      - name: Print collect_status_feed.py rest (261-end)
        run: |
          echo "===== collect_status_feed.py REST (261-end) ====="
          sed -n '261,$p' /tmp/ccp/Tools/collect_status_feed.py
          echo "===== END REST ====="

      - name: Print send_push_notification.py in full
        run: |
          echo "===== send_push_notification.py FULL ====="
          cat /tmp/ccp/Tools/send_push_notification.py
          echo "===== END send_push_notification.py ====="
