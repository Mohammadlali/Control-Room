name: Retire check_status_feed_freshness gate on ACC6

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DST_TOKEN: ${{ secrets.ACC6 }}
      BRANCH: claude/gateway-auth-fix-nr7k0b
      REPO: mohammadlali0707-stack/Claud-Cloud-Project
    steps:
      - name: Clone ACC6's Claud-Cloud-Project
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          echo "AUTH_HEADER=$AUTH_HEADER" >> "$GITHUB_ENV"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch "$BRANCH" --single-branch \
            "https://github.com/$REPO.git" /tmp/ccp
          cd /tmp/ccp
          git config user.email "control-room-bot@claud-cloud.local"
          git config user.name "Control Room Bot"
          echo "--- pre-patch HEAD ---"
          git log --oneline -3
          wc -l Team/MAP.md Team/NEW_SESSION_PROMPT.md

      - name: Decode helper scripts
        run: |
          set -e
          echo '' | base64 -d > /tmp/patch.py
          echo '' | base64 -d > /tmp/append_changelog.py
          echo '' | base64 -d > /tmp/record_hash.py
          python3 -c "import ast; ast.parse(open('/tmp/patch.py').read())"
          python3 -c "import ast; ast.parse(open('/tmp/append_changelog.py').read())"
          python3 -c "import ast; ast.parse(open('/tmp/record_hash.py').read())"
          echo "all three helper scripts decoded and syntax-checked OK"

      - name: Apply patch, delete retired tools, regenerate RULES.md
        run: |
          set -e
          cd /tmp/ccp
          python3 /tmp/patch.py
          git rm -q Tools/check_status_feed_freshness.py Tools/probe_check_status_feed_freshness.py
          python3 Tools/rules_index.py --write

      - name: Verify BEFORE committing (file-level gates, no external secrets needed)
        run: |
          set -e
          cd /tmp/ccp
          echo "== check_handover.py =="
          python3 Tools/check_handover.py
          echo "== verify_claims.py --all =="
          python3 Tools/verify_claims.py --all
          echo "== check_rules_index.py =="
          python3 Tools/check_rules_index.py
          echo "== confirm retired files are gone =="
          test ! -f Tools/check_status_feed_freshness.py
          test ! -f Tools/probe_check_status_feed_freshness.py
          echo "== confirm no leftover gate command lines =="
          ! grep -n "^    python Tools/check_status_feed_freshness.py\|^    python Tools/probe_check_status_feed_freshness.py" Team/MAP.md Team/NEW_SESSION_PROMPT.md
          echo "ALL PRE-COMMIT CHECKS PASSED."

      - name: Append CHANGELOG entry, commit and push (first commit, placeholder hash)
        run: |
          set -e
          cd /tmp/ccp
          python3 /tmp/append_changelog.py
          git add -A
          git status --short
          git commit -m "Retire check_status_feed_freshness gate on ACC6 (StatusFeed moved out entirely)"
          n=0
          until git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin "HEAD:$BRANCH"; do
            n=$((n+1))
            if [ "$n" -ge 4 ]; then echo "push failed after 4 attempts"; exit 1; fi
            sleep $((2 ** n))
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          HASH1=$(git rev-parse --short HEAD)
          echo "HASH1=$HASH1" >> "$GITHUB_ENV"
          echo "First push landed: $HASH1"

      - name: Record the real hash, commit and push (second commit, exempt from its own entry)
        run: |
          set -e
          cd /tmp/ccp
          python3 /tmp/record_hash.py "$HASH1"
          git add Team/CHANGELOG.md
          git commit -m "changelog: record $HASH1"
          n=0
          until git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin "HEAD:$BRANCH"; do
            n=$((n+1))
            if [ "$n" -ge 4 ]; then echo "push failed after 4 attempts"; exit 1; fi
            sleep $((2 ** n))
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          HASH2=$(git rev-parse --short HEAD)
          echo "Second push landed: $HASH2"

      - name: Verify AFTER both commits (now including check_changelog.py)
        run: |
          set -e
          cd /tmp/ccp
          echo "== check_changelog.py =="
          python3 Tools/check_changelog.py
          echo "== check_handover.py =="
          python3 Tools/check_handover.py
          echo "== verify_claims.py --all =="
          python3 Tools/verify_claims.py --all
          echo "== check_rules_index.py =="
          python3 Tools/check_rules_index.py
          echo "ALL POST-COMMIT CHECKS PASSED."
          wc -l Team/MAP.md

      - name: Dispatch and watch ACC6's own real gate suite (tbs-gates.yml)
        env:
          GH_TOKEN: ${{ secrets.ACC6 }}
        run: |
          set -e
          BEFORE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          gh workflow run tbs-gates.yml -R "$REPO" --ref "$BRANCH"
          echo "dispatched, waiting for a new run to appear..."
          RUN_ID=""
          for i in $(seq 1 20); do
            sleep 6
            RUN_ID=$(gh run list -R "$REPO" --workflow tbs-gates.yml --branch "$BRANCH" \
              --json databaseId,createdAt --jq \
              "[.[] | select(.createdAt > \"$BEFORE\")] | .[0].databaseId // empty")
            if [ -n "$RUN_ID" ]; then break; fi
          done
          if [ -z "$RUN_ID" ]; then
            echo "no new tbs-gates.yml run appeared within 2 minutes -- cannot verify in-job"
            exit 1
          fi
          echo "watching run $RUN_ID"
          gh run watch "$RUN_ID" -R "$REPO" --exit-status
