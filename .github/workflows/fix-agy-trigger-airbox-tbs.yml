name: One-off - fix @agy trigger convention on AirboxVIP and TBS

# Fleet-wide follow-up to control-agy.yml's own trigger fix (leading @agy
# -> trailing @agy, owner's explicit request). The audit
# (audit-agy-trigger-convention.yml) found every one of ACC1..ACC8's own
# agw-workers/agy-issue-bot.yml already uses the trailing convention (an
# earlier, correctly-directed relay from ACC6 already carried it there) --
# the two real gaps are the project repos with their OWN separate
# listener: AirboxVIP_Coffeenet (ACC1) and Claud-Cloud-Project/TBS (ACC6),
# both still leading-only, confirmed via inspect-agy-trigger-lines.yml's
# exact output.
#
# This does a SURGICAL string replace of just the startsWith(...) calls in
# each file's trigger `if:` (Tools/patch_agy_trigger.py), using the
# Contents API (GET for content+sha, PUT to update) with each account's
# own bare ACC1/ACC6 PAT -- not a full-file overwrite. That distinction
# matters: a full-file replace with a "known good" blob is exactly what
# propagate-agw-worker-fix.yml did, which clobbered independent local
# history on ACC6 (see CHANGELOG.md). Everything else in each file --
# author_association checks, the rest of the workflow -- is left
# untouched.

on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACC1: ${{ secrets.ACC1 }}
      ACC6: ${{ secrets.ACC6 }}
    steps:
      - uses: actions/checkout@v4

      - name: Patch both repos' agy-issue-bot.yml trigger to trailing @agy
        run: |
          patch_repo() {
            local token="$1" repo="$2"
            echo "=== $repo ==="
            RESP=$(curl -sS -H "Authorization: Bearer $token" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/contents/.github/workflows/agy-issue-bot.yml")
            SHA=$(echo "$RESP" | jq -r '.sha')
            if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
              echo "::error::could not fetch sha for $repo"
              echo "$RESP"
              return 1
            fi
            echo "$RESP" | jq -r '.content' | base64 -d > /tmp/orig.yml

            STATUS=$(python3 Tools/patch_agy_trigger.py /tmp/orig.yml /tmp/patched.yml)
            echo "patch status: $STATUS"
            if [ "$STATUS" != "CHANGED" ]; then
              echo "nothing to change for $repo, skipping write"
              return 0
            fi

            python3 Tools/validate_yaml.py /tmp/patched.yml
            echo "--- unified diff ---"
            diff -u /tmp/orig.yml /tmp/patched.yml || true

            NEW_CONTENT_B64=$(base64 -w0 /tmp/patched.yml)
            MSG='fix: match @agy at the end of the body/comment, not the start -- fleet-wide follow-up to Control-Room control-agy.yml, owner requested trailing convention everywhere; nothing else in this file changed'
            PAYLOAD=$(jq -n --arg msg "$MSG" --arg content "$NEW_CONTENT_B64" --arg sha "$SHA" \
              '{message:$msg, content:$content, sha:$sha}')
            CODE=$(curl -sS -o /tmp/put_resp.json -w "%{http_code}" -X PUT \
              -H "Authorization: Bearer $token" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${repo}/contents/.github/workflows/agy-issue-bot.yml" \
              -d "$PAYLOAD")
            echo "PUT HTTP $CODE for $repo"
            if [ "$CODE" != "200" ]; then
              echo "::error::PUT failed for $repo"
              cat /tmp/put_resp.json
              return 1
            fi
            echo "$repo: patched successfully."
          }

          patch_repo "$ACC1" "momonakikugava-pixel/AirboxVIP_Coffeenet"
          patch_repo "$ACC6" "mohammadlali0707-stack/Claud-Cloud-Project"
