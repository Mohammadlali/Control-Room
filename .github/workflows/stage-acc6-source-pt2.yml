name: Stage ACC6 StatusFeed source pt2 (remaining files + icons, exact git copy)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DST_TOKEN: ${{ secrets.ACC6 }}
    steps:
      - name: Checkout control-room (self, for pushing the staged copy)
        uses: actions/checkout@v4

      - name: Clone ACC6's Claud-Cloud-Project directly
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch claude/gateway-auth-fix-nr7k0b --single-branch \
            "https://github.com/mohammadlali0707-stack/Claud-Cloud-Project.git" /tmp/ccp

      - name: Copy remaining files (manifest, sw, vapid, api, icons)
        run: |
          set -e
          mkdir -p .github/deploy-staging/status-dashboard-migration/statusfeed/icons
          mkdir -p .github/deploy-staging/status-dashboard-migration/statusfeed/api
          cp /tmp/ccp/StatusFeed/manifest.json .github/deploy-staging/status-dashboard-migration/statusfeed/manifest.json
          cp /tmp/ccp/StatusFeed/sw.js .github/deploy-staging/status-dashboard-migration/statusfeed/sw.js
          cp /tmp/ccp/StatusFeed/vapid_public.json .github/deploy-staging/status-dashboard-migration/statusfeed/vapid_public.json
          cp /tmp/ccp/StatusFeed/api/subscribe.js .github/deploy-staging/status-dashboard-migration/statusfeed/api/subscribe.js
          cp /tmp/ccp/StatusFeed/icons/icon-192.png .github/deploy-staging/status-dashboard-migration/statusfeed/icons/icon-192.png
          cp /tmp/ccp/StatusFeed/icons/icon-512.png .github/deploy-staging/status-dashboard-migration/statusfeed/icons/icon-512.png
          ls -la .github/deploy-staging/status-dashboard-migration/statusfeed/ .github/deploy-staging/status-dashboard-migration/statusfeed/icons/ .github/deploy-staging/status-dashboard-migration/statusfeed/api/

      - name: Commit and push into control-room itself
        run: |
          set -e
          git config user.email "control-room-bot@claud-cloud.local"
          git config user.name "Control Room Bot"
          git add .github/deploy-staging/status-dashboard-migration
          if git diff --cached --quiet; then
            echo "No changes -- already staged identically."
          else
            git commit -m "Stage remaining StatusFeed files (manifest/sw/vapid/api/icons) for status-dashboard migration"
            git push origin HEAD:main
          fi
