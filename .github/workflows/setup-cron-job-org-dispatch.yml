name: Set up cron-job.org to dispatch status-dashboard's deploy every 5 min

on:
  workflow_dispatch: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRONJOB_API_KEY: ${{ secrets.AgentWorkflowGHCron }}
      DISPATCH_PAT: ${{ secrets.STATUS_DASHBOARD_DISPATCH_PAT }}
    steps:
      - name: Guard
        run: |
          set -e
          if [ -z "$CRONJOB_API_KEY" ]; then echo "::error::secrets.AgentWorkflowGHCron is not set"; exit 1; fi
          if [ -z "$DISPATCH_PAT" ]; then echo "::error::secrets.STATUS_DASHBOARD_DISPATCH_PAT is not set"; exit 1; fi

      - name: Decode helper scripts
        run: |
          set -e
          echo '' | base64 -d > /tmp/find_existing_job.py
          echo '' | base64 -d > /tmp/create_cronjob.py
          python3 -c "import ast; ast.parse(open('/tmp/find_existing_job.py').read())"
          python3 -c "import ast; ast.parse(open('/tmp/create_cronjob.py').read())"
          echo "helper scripts decoded and syntax-checked OK"

      - name: Check the PAT can actually dispatch (fail fast before creating the cron job)
        run: |
          set -e
          CODE=$(curl -s -o /tmp/dispatch_test.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $DISPATCH_PAT" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}' \
            "https://api.github.com/repos/Mohammadlali/status-dashboard/actions/workflows/deploy-status-feed.yml/dispatches")
          echo "HTTP $CODE"
          cat /tmp/dispatch_test.json 2>/dev/null || true
          if [ "$CODE" != "204" ]; then
            echo "::error::PAT dispatch test failed (expected 204)"
            exit 1
          fi
          echo "PAT confirmed working: it just dispatched a real deploy-status-feed.yml run."

      - name: Check whether a matching cron-job.org job already exists (idempotency)
        id: existing
        run: |
          set -e
          RESP=$(curl -s -H "Authorization: Bearer $CRONJOB_API_KEY" "https://api.cron-job.org/jobs")
          echo "$RESP" > /tmp/existing_jobs.json
          EXISTING_ID=$(echo "$RESP" | python3 /tmp/find_existing_job.py)
          echo "existing_id=$EXISTING_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$EXISTING_ID" ]; then
            echo "A job already targets this URL: jobId=$EXISTING_ID -- will not create a duplicate."
          else
            echo "No existing job targets this URL -- will create one."
          fi

      - name: Create the cron-job.org job (every 5 minutes, UTC)
        if: steps.existing.outputs.existing_id == ''
        run: python3 /tmp/create_cronjob.py

      - name: Verify the created (or existing) job's real definition
        run: |
          set -e
          JOB_ID="${NEW_JOB_ID:-${{ steps.existing.outputs.existing_id }}}"
          echo "Verifying job $JOB_ID"
          curl -s -H "Authorization: Bearer $CRONJOB_API_KEY" "https://api.cron-job.org/jobs/$JOB_ID" | python3 -m json.tool
