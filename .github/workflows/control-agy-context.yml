name: Control-Room AGY Discussion Responder

on:
  discussion_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  discussions: write

jobs:
  discussion-responder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'discussion_comment' &&
      startsWith(github.event.comment.body, '@agy') &&
      github.event.comment.user.type != 'Bot'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build context prompt
        id: prompt
        env:
          CTRL_TOKEN: ${{ secrets.CONTROL_ROOM_PAT }}
          USER_COMMENT: ${{ github.event.comment.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_NUM: ${{ github.event.discussion.number }}
          DISCUSSION_NODE: ${{ github.event.discussion.node_id }}
        run: |
          REPO='mohammadlali0707-stack/Control-Room'
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_COMMENT=$(printf '%s' "$USER_COMMENT" | sanitize)
          SAFE_DT=$(printf '%s' "$DISCUSSION_TITLE" | sanitize)
          SAFE_DB=$(printf '%s' "$DISCUSSION_BODY" | sanitize)
          printf '%s\n' "$DISCUSSION_NODE" > /tmp/disc_node.txt
          {
            printf '%s\n' '=== CONTEXT MODE ==='
            printf '%s\n' 'Read discussion context. Output your answer. Do NOT call any APIs.'
            printf '%s\n' ''
            printf '%s\n' '=== IMPORTANT OUTPUT FORMAT ==='
            printf '%s\n' 'Your ENTIRE response must be the answer text only.'
            printf '%s\n' 'No preamble, no explanation of what you are doing.'
            printf '%s\n' 'Just the answer in the same language as the question.'
            printf '%s\n' ''
            printf '%s\n' '=== CREDENTIALS (only needed for CASE B) ==='
            printf 'CTRL_TOKEN: %s\n' "$CTRL_TOKEN"
            printf 'REPO: %s\n' "$REPO"
            printf '%s\n' ''
            printf 'DISCUSSION #%s: %s\n' "$DISCUSSION_NUM" "$SAFE_DT"
            printf '%s\n' ''
            printf '%s\n' "$SAFE_DB"
            printf '%s\n' ''
            printf '%s\n' '=== USER COMMENT ==='
            printf '%s\n' "$SAFE_COMMENT"
            printf '%s\n' ''
            printf '%s\n' '=== INSTRUCTIONS ==='
            printf '%s\n' 'Determine which case applies:'
            printf '%s\n' ''
            printf '%s\n' 'CASE A - User asks a QUESTION about the context:'
            printf '%s\n' '  Output ONLY the answer text. Match the language of the question.'
            printf '%s\n' '  Do NOT clone repo, run gates, or call any APIs.'
            printf '%s\n' '  The workflow will post your output as a Discussion reply automatically.'
            printf '%s\n' ''
            printf '%s\n' 'CASE B - User requests a CODE CHANGE or ACTION:'
            printf '  POST https://api.github.com/repos/%s/issues\n' "$REPO"
            printf '%s\n' '  Authorization: Bearer CTRL_TOKEN'
            printf '%s\n' '  title: descriptive title'
            printf '%s\n' '  body: @agy on first line, detailed task with acceptance criteria'
            printf '%s\n' '  Then output: "Created issue: <issue URL>"'
            printf '%s\n' '  The issue bot will handle the actual implementation.'
          } > /tmp/prompt.txt
          printf 'Prompt: %s lines\n' "$(wc -l < /tmp/prompt.txt)"

      - name: Dispatch to agw-workers
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo Mohammadlali/agw-workers \
            --field "prompt=$PROMPT" \
            --field "acc_index=0" \
            --field "callback_id=cr-disc-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list --repo Mohammadlali/agw-workers \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for worker
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          for i in $(seq 1 40); do
            ST=$(gh run view "$RID" --repo Mohammadlali/agw-workers --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

      - name: Download AGY output
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          mkdir -p /tmp/agy-out
          gh run download "$RID" --repo Mohammadlali/agw-workers --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          if [ -n "$OUT" ]; then
            head -c 58000 "$OUT" > /tmp/final.txt
          else
            printf '%s\n' '(AGY produced no output)' > /tmp/final.txt
          fi
          echo "Output size: $(wc -c < /tmp/final.txt) bytes"

      - name: Post reply to Discussion
        env:
          CTRL_TOKEN: ${{ secrets.CONTROL_ROOM_PAT }}
          DISCUSSION_NODE: ${{ github.event.discussion.node_id }}
        run: |
          ANSWER=$(cat /tmp/final.txt)
          WORKER_URL="https://github.com/Mohammadlali/agw-workers/actions/runs/${{ steps.dispatch.outputs.run_id }}"
          FULL_REPLY=$(printf '%s\n\n---\n*AGY worker run: %s*' "$ANSWER" "$WORKER_URL")
          jq -n \
            --arg node "$DISCUSSION_NODE" \
            --arg body "$FULL_REPLY" \
            '{query: "mutation($did: ID!, $body: String!) { addDiscussionComment(input: {discussionId: $did, body: $body}) { comment { id } } }", variables: {did: $node, body: $body}}' | \
          curl -sf -X POST https://api.github.com/graphql \
            -H "Authorization: Bearer $CTRL_TOKEN" \
            -H "Content-Type: application/json" \
            -d @- | jq '.data.addDiscussionComment.comment.id'
