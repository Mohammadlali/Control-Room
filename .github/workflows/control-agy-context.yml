name: Control-Room AGY Discussion Responder

on:
  discussion_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  discussions: write

jobs:
  discussion-responder:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      github.event_name == 'discussion_comment' &&
      startsWith(github.event.comment.body, '@agy') &&
      github.event.comment.user.type != 'Bot'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build context prompt
        id: prompt
        env:
          CTRL_TOKEN: ${{ secrets.CONTROL_ROOM_PAT }}
          USER_COMMENT: ${{ github.event.comment.body }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_NUM: ${{ github.event.discussion.number }}
          DISCUSSION_NODE: ${{ github.event.discussion.node_id }}
        run: |
          REPO='mohammadlali0707-stack/Control-Room'
          sanitize() { sed "s/\`/'/g; s/\"/'/g; s/\$(/DOLLAR(/g; s/\${/DOLLAR{/g"; }
          SAFE_COMMENT=$(printf '%s' "$USER_COMMENT" | sanitize)
          SAFE_DT=$(printf '%s' "$DISCUSSION_TITLE" | sanitize)
          SAFE_DB=$(printf '%s' "$DISCUSSION_BODY" | sanitize)
          {
            printf '%s\n' '=== CONTEXT MODE ==='
            printf '%s\n' 'Read discussion context. Answer the question OR create an issue.'
            printf '%s\n' ''
            printf '%s\n' '=== CREDENTIALS ==='
            printf 'CTRL_TOKEN: %s\n' "$CTRL_TOKEN"
            printf 'REPO: %s\n' "$REPO"
            printf '%s\n' ''
            printf 'DISCUSSION #%s: %s\n' "$DISCUSSION_NUM" "$SAFE_DT"
            printf '%s\n' ''
            printf '%s\n' "$SAFE_DB"
            printf '%s\n' ''
            printf '%s\n' '=== USER COMMENT ==='
            printf '%s\n' "$SAFE_COMMENT"
            printf '%s\n' ''
            printf '%s\n' '=== INSTRUCTIONS ==='
            printf '%s\n' 'Determine which case applies:'
            printf '%s\n' ''
            printf '%s\n' 'CASE A - User asks a QUESTION:'
            printf '%s\n' '  1. Read the discussion context above carefully.'
            printf '%s\n' '  2. Answer clearly in same language (Persian or English).'
            printf '%s\n' '  3. Post your answer via GraphQL:'
            printf '%s\n' '     POST https://api.github.com/graphql'
            printf '%s\n' '     Header: Authorization: Bearer CTRL_TOKEN'
            printf '%s\n' '     Header: Content-Type: application/json'
            printf '     Body: {"query": "mutation { addDiscussionComment(input: {discussionId: \"%s\", body: \"ANSWER_HERE\"}) { comment { id } } }" }\n' "$DISCUSSION_NODE"
            printf '%s\n' '  4. Do NOT clone repo or run gates.'
            printf '%s\n' ''
            printf '%s\n' 'CASE B - User requests a code change or ACTION:'
            printf '  1. POST https://api.github.com/repos/%s/issues\n' "$REPO"
            printf '%s\n' '     Authorization: Bearer CTRL_TOKEN'
            printf '%s\n' '     title: clear descriptive title'
            printf '%s\n' '     body: @agy on first line, then detailed task with acceptance criteria'
            printf '%s\n' '  2. Reply to discussion with the new issue URL.'
            printf '%s\n' '  3. The AGY issue bot will automatically process that issue.'
            printf '%s\n' '  4. Do NOT do the actual work here - just create the issue.'
          } > /tmp/prompt.txt
          printf 'Prompt: %s lines\n' "$(wc -l < /tmp/prompt.txt)"

      - name: Dispatch to agw-workers
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          PROMPT=$(cat /tmp/prompt.txt)
          gh workflow run agw-worker.yml \
            --repo Mohammadlali/agw-workers \
            --field "prompt=$PROMPT" \
            --field "acc_index=0" \
            --field "callback_id=cr-disc-${{ github.run_id }}"
          sleep 10
          RUN_ID=$(gh run list --repo Mohammadlali/agw-workers \
            --workflow agw-worker.yml --limit 1 --json databaseId -q '.[0].databaseId')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for worker
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          for i in $(seq 1 40); do
            ST=$(gh run view "$RID" --repo Mohammadlali/agw-workers --json status -q '.status')
            echo "[$i/40] $ST"
            [ "$ST" = "completed" ] && break
            sleep 30
          done

      - name: Log result
        env:
          GH_TOKEN: ${{ secrets.MOHAMMADLALI_PAT }}
        run: |
          RID="${{ steps.dispatch.outputs.run_id }}"
          mkdir -p /tmp/agy-out
          gh run download "$RID" --repo Mohammadlali/agw-workers --dir /tmp/agy-out 2>/dev/null || true
          OUT=$(find /tmp/agy-out -name "agy_output.txt" | head -1)
          [ -n "$OUT" ] && head -c 10000 "$OUT" || echo "(no output)"
