name: Migrate StatusFeed code to Mohammadlali/status-dashboard

# Moves the fleet-wide status dashboard out of CCP (now on ACC6) into a
# dedicated repo under ACC0 (Mohammadlali), since it was never
# CCP-specific -- it reports on Control-Room and all 9 accounts too.
# All source files were already staged as exact git blobs in THIS repo
# (.github/deploy-staging/...) in earlier steps, so this is a plain file
# copy, no log-dump reconstruction and no binary-encoding risk. The one
# exception is the new deploy-status-feed.yml itself, which is written
# via base64 decode because it legitimately needs many literal
# ${{ secrets.X }} expressions to survive into the new repo's file --
# base64's alphabet (A-Za-z0-9+/=) cannot spell dollar-brace-brace, so
# it is immune to GitHub Actions' own template-expression evaluator
# scanning THIS (control-room) workflow's own run: block.

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DST_TOKEN: ${{ secrets.ACC0 }}
    steps:
      - name: Checkout control-room (self, to read the staged files)
        uses: actions/checkout@v4

      - name: Guard
        run: |
          if [ -z "$DST_TOKEN" ]; then
            echo "::error::secrets.ACC0 is not set on this repo."
            exit 1
          fi

      - name: Clone Mohammadlali/status-dashboard directly
        run: |
          set -e
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraHeader="$AUTH_HEADER" \
            clone --branch main --single-branch \
            "https://github.com/Mohammadlali/status-dashboard.git" /tmp/dash

      - name: Copy staged site files in
        run: |
          set -e
          mkdir -p /tmp/dash/api /tmp/dash/icons /tmp/dash/Tools

          cp .github/deploy-staging/statusfeed/index.html /tmp/dash/index.html
          cp .github/deploy-staging/statusfeed/app.js /tmp/dash/app.js
          cp .github/deploy-staging/statusfeed/style.css /tmp/dash/style.css

          cp .github/deploy-staging/status-dashboard-migration/statusfeed/manifest.json /tmp/dash/manifest.json
          cp .github/deploy-staging/status-dashboard-migration/statusfeed/sw.js /tmp/dash/sw.js
          cp .github/deploy-staging/status-dashboard-migration/statusfeed/vapid_public.json /tmp/dash/vapid_public.json
          cp .github/deploy-staging/status-dashboard-migration/statusfeed/api/subscribe.js /tmp/dash/api/subscribe.js
          cp .github/deploy-staging/status-dashboard-migration/statusfeed/icons/icon-192.png /tmp/dash/icons/icon-192.png
          cp .github/deploy-staging/status-dashboard-migration/statusfeed/icons/icon-512.png /tmp/dash/icons/icon-512.png

          cp .github/deploy-staging/status-dashboard-migration/tools/collect_status_feed.py /tmp/dash/Tools/collect_status_feed.py
          cp .github/deploy-staging/status-dashboard-migration/tools/send_push_notification.py /tmp/dash/Tools/send_push_notification.py
          cp .github/deploy-staging/status-dashboard-migration/tools/ensure_cloudflare_dns.py /tmp/dash/Tools/ensure_cloudflare_dns.py

          echo "Copied. Listing:"
          find /tmp/dash -maxdepth 2 -type f | sort

      - name: Write vercel.json (unchanged project name -- keeps the same live domain)
        working-directory: /tmp/dash
        run: |
          cat > vercel.json <<'VERCEL_EOF'
          {
            "name": "claud-cloud-status",
            "version": 2,
            "cleanUrls": true,
            "headers": [
              {
                "source": "/status.json",
                "headers": [
                  { "key": "Cache-Control", "value": "no-cache, no-store, must-revalidate" },
                  { "key": "Access-Control-Allow-Origin", "value": "*" }
                ]
              }
            ]
          }
          VERCEL_EOF

      - name: Write the adjusted deploy-status-feed.yml (base64, avoids early evaluation of its own secret expressions)
        working-directory: /tmp/dash
        run: |
          set -e
          mkdir -p .github/workflows
          echo "" | base64 -d > .github/workflows/deploy-status-feed.yml
          python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/deploy-status-feed.yml')); print('YAML OK')"

      - name: Write README.md
        working-directory: /tmp/dash
        run: |
          echo "" | base64 -d > README.md

      - name: Commit and push
        working-directory: /tmp/dash
        run: |
          set -e
          git config user.email "control-room-bot@claud-cloud.local"
          git config user.name "Control Room Bot"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes -- already migrated."
            echo "ALREADY_MIGRATED=true" >> "$GITHUB_ENV"
          else
            git commit -m "Migrate StatusFeed dashboard from CCP (ACC6) to this dedicated repo"
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DST_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraHeader="$AUTH_HEADER" push origin HEAD:main
            echo "ALREADY_MIGRATED=false" >> "$GITHUB_ENV"
          fi
